<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>নতুন শিক্ষার্থী | জ্ঞানতরঙ্গ</title><style>
:root{--bg:#060817;--card:#10142b;--p:#8b3dff;--pk:#ec3fa7;--b:rgba(255,255,255,.09);--m:#9aa2bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(139,61,255,.18),transparent 35%),var(--bg);color:#fff;font-family:"Noto Sans Bengali",system-ui,sans-serif}.header{padding:16px;border-bottom:1px solid var(--b);background:rgba(6,8,23,.9)}.header-inner{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.logo{width:44px;height:44px;border-radius:12px;object-fit:contain}.brand-text{font-weight:900;font-size:17px}.brand-sub{font-size:10px;color:var(--m)}.back{color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--b);font-size:12px;font-weight:800}.container{width:min(94%,620px);margin:28px auto 50px}.title{font-size:25px;margin:0 0 7px}.sub{color:var(--m);font-size:13px;margin:0 0 20px}.card{background:rgba(16,20,43,.9);border:1px solid var(--b);border-radius:20px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.st{font-size:18px;font-weight:900;margin-bottom:18px}.note{padding:12px;border-radius:12px;background:rgba(47,214,138,.07);border:1px solid rgba(47,214,138,.18);color:#c9f8e0;font-size:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field label{display:block;color:#dce0f0;font-size:13px;margin-bottom:7px;font-weight:700}.field input{width:100%;border:1px solid var(--b);background:#0b0e20;color:#fff;padding:12px 13px;border-radius:11px;outline:none;font-size:14px}.field input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(139,61,255,.1)}.btn{width:100%;margin-top:18px;border:0;background:linear-gradient(135deg,var(--p),var(--pk));color:#fff;padding:13px 15px;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.msg{display:none;margin-bottom:15px;padding:12px;border-radius:12px;font-size:13px}.msg.show{display:block}.error{color:#ffd0dc;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2)}.success{color:#c9f8e0;background:rgba(47,214,138,.1);border:1px solid rgba(47,214,138,.2)}.login{text-align:center;color:var(--m);font-size:12px;margin-top:15px}.login a{color:#d8b4fe;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="header"><div class="header-inner"><a href="index.html" class="brand"><img class="logo" src="gyantarongo-logo-transparent-1.png" alt="জ্ঞানতরঙ্গ"><div><div class="brand-text">জ্ঞানতরঙ্গ</div><div class="brand-sub">শিখি · জানি · এগিয়ে যাই</div></div></a><a href="profile.html" class="back">← লগইন</a></div></header><main class="container"><h1 class="title">📝 নতুন শিক্ষার্থী অ্যাকাউন্ট</h1><p class="sub">আপনার স্থায়ী শিক্ষার্থী অ্যাকাউন্ট তৈরি করুন।</p><div id="message" class="msg"></div><section class="card"><div class="st">🎓 শিক্ষার্থী রেজিস্ট্রেশন</div><div class="note">অ্যাকাউন্ট তৈরি হলে আপনার জন্য একটি স্থায়ী Student ID তৈরি হবে।</div><div class="grid"><div class="field full"><label>পূর্ণ নাম *</label><input id="fullName" placeholder="আপনার পূর্ণ নাম"></div><div class="field"><label>মোবাইল নম্বর *</label><input id="mobile" type="tel" placeholder="01XXXXXXXXX"></div><div class="field"><label>ইমেইল *</label><input id="email" type="email" placeholder="example@gmail.com"></div><div class="field"><label>প্রতিষ্ঠান</label><input id="institution" placeholder="স্কুল / কলেজ / মাদ্রাসা"></div><div class="field"><label>শ্রেণি</label><input id="studentClass" placeholder="যেমন: দশম"></div><div class="field"><label>জেলা</label><input id="district" placeholder="আপনার জেলা"></div><div class="field"><label>বিভাগ</label><input id="division" placeholder="আপনার বিভাগ"></div><div class="field"><label>পাসওয়ার্ড *</label><input id="password" type="password" placeholder="কমপক্ষে ৬ অক্ষর"></div><div class="field"><label>পাসওয়ার্ড নিশ্চিত করুন *</label><input id="confirmPassword" type="password" placeholder="আবার লিখুন"></div></div><button id="registerBtn" class="btn" type="button">📝 অ্যাকাউন্ট তৈরি করুন</button><div class="login">আগে থেকেই অ্যাকাউন্ট আছে? <a href="profile.html">লগইন করুন</a></div></section></main><script type="module">
import{auth,db}from"./firebase-config.js";import{createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const $=id=>document.getElementById(id);function msg(t,type="error"){const e=$("message");e.textContent=t;e.className="msg show "+type}function studentId(){return"GT-STU-"+Math.floor(100000+Math.random()*900000)}$("registerBtn").addEventListener("click",async()=>{const b=$("registerBtn"),fullName=$("fullName").value.trim(),mobile=$("mobile").value.trim(),email=$("email").value.trim(),institution=$("institution").value.trim(),studentClass=$("studentClass").value.trim(),district=$("district").value.trim(),division=$("division").value.trim(),password=$("password").value,confirm=$("confirmPassword").value;if(!fullName||!mobile||!email||!password||!confirm)return msg("⚠️ নাম, মোবাইল, ইমেইল ও পাসওয়ার্ড পূরণ করুন।");if(password.length<6)return msg("⚠️ পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");if(password!==confirm)return msg("⚠️ দুইটি পাসওয়ার্ড মিলছে না।");b.disabled=true;b.textContent="⏳ অ্যাকাউন্ট তৈরি হচ্ছে...";try{const r=await createUserWithEmailAndPassword(auth,email,password),u=r.user,id=studentId();await setDoc(doc(db,"profiles",u.uid),{full_name:fullName,mobile,email,institution,class:studentClass,class_name:studentClass,district,division,student_id:id,student_uid:id,role:"student",is_active:true,created_at:serverTimestamp(),updated_at:serverTimestamp()});msg("🎉 অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে। Student ID: "+id,"success");b.textContent="✅ অ্যাকাউন্ট তৈরি হয়েছে";setTimeout(()=>location.href="profile.html",1200)}catch(e){console.error(e);let t="❌ অ্যাকাউন্ট তৈরি করা যায়নি। আবার চেষ্টা করুন।";if(e.code==="auth/email-already-in-use")t="❌ এই ইমেইল দিয়ে ইতিমধ্যে একটি অ্যাকাউন্ট আছে।";else if(e.code==="auth/invalid-email")t="❌ ইমেইল ঠিকানাটি সঠিক নয়।";else if(e.code==="auth/weak-password")t="❌ পাসওয়ার্ড আরও শক্তিশালী দিন।";else if(e.code==="auth/operation-not-allowed")t="❌ Firebase-এ Email/Password Login চালু নেই।";else if(e.code==="permission-denied")t="❌ Profile তৈরি করার অনুমতি নেই। Firebase Rules পরীক্ষা করতে হবে।";msg(t);b.disabled=false;b.textContent="📝 অ্যাকাউন্ট তৈরি করুন"}});
</script></body></html>
