<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নোটিশ ব্যবস্থাপনা | জ্ঞানতরঙ্গ</title><style>:root{--bg:#041312;--card:#0a201d;--g:#2fd68a;--muted:#a9c2bd;--b:#ffffff16;--red:#ff5470}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#2fd68a20,transparent 32%),linear-gradient(135deg,#03100f,#061b18);color:#fff;font-family:"Noto Sans Bengali",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}.top a{color:#fff;text-decoration:none;font-size:24px}.logo{width:48px}.brand b{display:block;font-size:19px}.brand small{color:var(--muted)}.grid{display:grid;grid-template-columns:360px 1fr;gap:15px}.card{background:#0a201dee;border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:15px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#d8ebe6;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:10px;background:#041312;color:#fff}textarea{min-height:150px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#2fd68a,#19a96c);color:#032018}.secondary{background:#ffffff0c;color:#fff;border:1px solid var(--b)}.red{background:#ff547022;color:#ff9aaa;border:1px solid #ff547033}.item{padding:14px;border:1px solid var(--b);border-radius:14px;margin:10px 0;background:#ffffff05}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#2fd68a18;color:#75efb8;font-size:10px}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><header class="top"><a href="admin-5.html">←</a><img class="logo" src="gyantarongo-logo-transparent-1.png"><div class="brand"><b>নোটিশ ব্যবস্থাপনা</b><small>জ্ঞানতরঙ্গ Admin Panel</small></div></header><div class="grid"><section class="card"><h2 id="formTitle">➕ নতুন নোটিশ</h2><input type="hidden" id="editId"><div class="field"><label>শিরোনাম *</label><input id="title"></div><div class="field"><label>বিস্তারিত *</label><textarea id="message"></textarea></div><label style="font-size:12px;color:var(--muted)"><input id="published" type="checkbox"> এখনই প্রকাশ করুন</label><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="save">💾 Save</button><button class="btn secondary" id="reset">পরিষ্কার</button></div><div id="msg" style="margin-top:10px;color:var(--muted)"></div></section><section class="card"><div style="display:flex;justify-content:space-between"><h2>📢 নোটিশসমূহ</h2><button class="btn secondary" onclick="loadNotices()">🔄</button></div><div id="list"><div class="empty">লোড হচ্ছে...</div></div></section></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{collection,getDocs,getDoc,doc,addDoc,updateDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';let user=null,items=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function guard(u){if(!u){location.href='admin-5.html';return false}const s=await getDoc(doc(db,'profiles',u.uid));if(!s.exists()||s.data().role!=='admin'||s.data().is_active!==true){location.href='admin-5.html';return false}user=u;return true}async function loadNotices(){const s=await getDocs(collection(db,'notices'));items=s.docs.map(d=>({id:d.id,...d.data()}));$('list').innerHTML=items.length?items.map(n=>`<div class="item"><b>${esc(n.title||'নোটিশ')}</b><p style="color:#cfe0dc;line-height:1.7">${esc(n.message||'')}</p><span class="tag">${n.published?'প্রকাশিত':'গোপন'}</span><div style="margin-top:10px;display:flex;gap:7px"><button class="btn secondary" onclick="editNotice('${n.id}')">Edit</button><button class="btn red" onclick="removeNotice('${n.id}')">Delete</button></div></div>`).join(''):'<div class="empty">কোনো নোটিশ নেই।</div>'}window.loadNotices=loadNotices;window.editNotice=id=>{const n=items.find(x=>x.id===id);if(!n)return;$('editId').value=id;$('formTitle').textContent='✏️ নোটিশ সম্পাদনা';$('title').value=n.title||'';$('message').value=n.message||n.content||'';$('published').checked=n.published===true;scrollTo({top:0,behavior:'smooth'})};window.removeNotice=async id=>{if(!confirm('নোটিশটি মুছে ফেলবেন?'))return;await deleteDoc(doc(db,'notices',id));loadNotices()};$('save').onclick=async()=>{const title=$('title').value.trim(),message=$('message').value.trim();if(!title||!message){$('msg').textContent='শিরোনাম ও বিস্তারিত দিন।';return}const data={title,message,published:$('published').checked,updated_at:serverTimestamp(),updated_by:user.uid};const id=$('editId').value;if(id)await updateDoc(doc(db,'notices',id),data);else await addDoc(collection(db,'notices'),{...data,created_at:serverTimestamp()});$('msg').textContent='✅ সংরক্ষণ হয়েছে।';$('reset').click();loadNotices()};$('reset').onclick=()=>{['editId','title','message'].forEach(id=>$(id).value='');$('published').checked=false;$('formTitle').textContent='➕ নতুন নোটিশ';$('msg').textContent=''};onAuthStateChanged(auth,async u=>{if(await guard(u))loadNotices()});</script></body></html>
