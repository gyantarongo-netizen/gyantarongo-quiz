<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>জ্ঞানতরঙ্গ | Question Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Bengali", sans-serif;
      background:
        radial-gradient(circle at top left, #25104d 0%, transparent 35%),
        radial-gradient(circle at bottom right, #102f3b 0%, transparent 35%),
        #060817;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: min(1000px, 94%);
      margin: auto;
      padding: 25px 0 50px;
    }

    .header {
      background: rgba(16, 20, 43, .95);
      border: 1px solid rgba(139, 61, 255, .3);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #aeb4cf;
      line-height: 1.7;
    }

    .card {
      background: rgba(16, 20, 43, .94);
      border: 1px solid rgba(139, 61, 255, .25);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #dce0f4;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #353b63;
      background: #080b1d;
      color: #fff;
      outline: none;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #8b3dff;
      box-shadow: 0 0 0 2px rgba(139,61,255,.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .save-btn {
      width: 100%;
      margin-top: 20px;
      background: linear-gradient(135deg, #8b3dff, #ec3fa7);
      color: white;
    }

    .cancel-btn {
      width: 100%;
      margin-top: 10px;
      background: #292e4c;
      color: white;
    }

    .question-item {
      background: #0b1025;
      border: 1px solid #30375c;
      border-radius: 16px;
      padding: 17px;
      margin-top: 14px;
    }

    .question-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .option-line {
      color: #b9bfd8;
      margin-top: 7px;
      line-height: 1.6;
    }

    .correct {
      color: #2fd68a;
      font-weight: 800;
      margin-top: 12px;
    }

    .question-meta {
      color: #ffb21c;
      margin-top: 10px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .edit {
      background: #8b3dff;
      color: white;
      flex: 1;
    }

    .delete {
      background: #8f284f;
      color: white;
      flex: 1;
    }

    .message {
      margin-top: 15px;
      color: #ffb21c;
      line-height: 1.7;
    }

    .security-note {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      background: rgba(47,214,138,.08);
      border: 1px solid rgba(47,214,138,.2);
      color: #9eeac8;
      line-height: 1.7;
      font-size: 14px;
    }

    .empty {
      color: #aeb4cf;
      text-align: center;
      padding: 25px 10px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      color: #aeb4cf;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h1>❓ Question Management</h1>

    <p>
      কুইজের প্রশ্ন, অপশন, সঠিক উত্তর ও Negative Marking পরিচালনা করুন।
    </p>

  </div>


  <!-- QUESTION FORM -->

  <div class="card">

    <label>
      কুইজ নির্বাচন করুন
    </label>

    <select id="quizSelect">

      <option value="">
        ⏳ কুইজ লোড হচ্ছে...
      </option>

    </select>


    <label>
      প্রশ্ন
    </label>

    <textarea
      id="questionText"
      placeholder="প্রশ্ন লিখুন"></textarea>


    <div class="grid">

      <div>

        <label>
          অপশন A
        </label>

        <input
          id="optionA"
          type="text"
          placeholder="অপশন A">

      </div>


      <div>

        <label>
          অপশন B
        </label>

        <input
          id="optionB"
          type="text"
          placeholder="অপশন B">

      </div>


      <div>

        <label>
          অপশন C
        </label>

        <input
          id="optionC"
          type="text"
          placeholder="অপশন C">

      </div>


      <div>

        <label>
          অপশন D
        </label>

        <input
          id="optionD"
          type="text"
          placeholder="অপশন D">

      </div>

    </div>


    <div class="grid">

      <div>

        <label>
          সঠিক উত্তর
        </label>

        <select id="correctAnswer">

          <option value="">
            সঠিক উত্তর নির্বাচন করুন
          </option>

          <option value="A">
            A
          </option>

          <option value="B">
            B
          </option>

          <option value="C">
            C
          </option>

          <option value="D">
            D
          </option>

        </select>

      </div>


      <div>

        <label>
          প্রশ্নের নম্বর
        </label>

        <input
          id="marks"
          type="number"
          min="0"
          step="0.01"
          value="1">

      </div>

    </div>


    <label>
      Negative Marking
    </label>

    <input
      id="negativeMark"
      type="number"
      min="0"
      step="0.01"
      value="0.25">


    <button
      id="saveBtn"
      class="save-btn">

      ➕ প্রশ্ন যোগ করুন

    </button>


    <button
      id="cancelBtn"
      class="cancel-btn hidden">

      বাতিল করুন

    </button>


    <div
      id="message"
      class="message">
    </div>


    <div class="security-note">

      🔒 নিরাপত্তা:
      শিক্ষার্থীর পরীক্ষার জন্য আলাদা
      <b>exam_questions</b>
      collection ব্যবহার করা হবে।

      সেখানে সঠিক উত্তর রাখা হবে না।

    </div>

  </div>


  <!-- QUESTION LIST -->

  <div class="card">

    <h2>
      📋 প্রশ্ন তালিকা
    </h2>

    <div id="questionsList">

      <div class="empty">
        আগে একটি কুইজ নির্বাচন করুন।
      </div>

    </div>

  </div>

</div>


<script type="module">

  import {
    auth,
    db
  } from "./firebase-config.js";


  import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    addDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /*
   * ELEMENTS
   */

  const quizSelect =
    document.getElementById("quizSelect");

  const questionText =
    document.getElementById("questionText");

  const optionA =
    document.getElementById("optionA");

  const optionB =
    document.getElementById("optionB");

  const optionC =
    document.getElementById("optionC");

  const optionD =
    document.getElementById("optionD");

  const correctAnswer =
    document.getElementById("correctAnswer");

  const marks =
    document.getElementById("marks");

  const negativeMark =
    document.getElementById("negativeMark");

  const saveBtn =
    document.getElementById("saveBtn");

  const cancelBtn =
    document.getElementById("cancelBtn");

  const message =
    document.getElementById("message");

  const questionsList =
    document.getElementById("questionsList");


  /*
   * EDIT VARIABLES
   */

  let editingQuestionId = null;

  let editingPublicQuestionId = null;


  /*
   * MESSAGE
   */

  function showMessage(text) {

    message.textContent = text;

  }


  /*
   * ADMIN AUTH CHECK
   */

  auth.onAuthStateChanged(
    async (user) => {

      if (!user) {

        showMessage(
          "❌ Admin Login প্রয়োজন।"
        );

        return;
      }


      try {

        const profileRef =
          doc(
            db,
            "profiles",
            user.uid
          );


        const profileSnap =
          await getDoc(profileRef);


        if (!profileSnap.exists()) {

          showMessage(
            "❌ Admin Profile পাওয়া যায়নি।"
          );

          return;
        }


        const profile =
          profileSnap.data();


        if (
          profile.role !== "admin" ||
          profile.is_active !== true
        ) {

          showMessage(
            "❌ আপনার Admin অনুমতি নেই।"
          );

          return;
        }


        await loadQuizzes();

      } catch (error) {

        console.error(error);

        showMessage(
          "❌ Admin তথ্য যাচাই করতে সমস্যা হয়েছে।"
        );

      }

    }
  );


  /*
   * LOAD QUIZZES
   */

  async function loadQuizzes() {

    quizSelect.innerHTML = `

      <option value="">
        কুইজ নির্বাচন করুন
      </option>

    `;


    try {

      const snapshot =
        await getDocs(
          collection(db, "quizzes")
        );


      if (snapshot.empty) {

        showMessage(
          "⚠️ এখনো কোনো কুইজ তৈরি করা হয়নি।"
        );

        return;
      }


      snapshot.forEach(
        (docSnap) => {

          const data =
            docSnap.data();


          const option =
            document.createElement(
              "option"
            );


          option.value =
            docSnap.id;


          option.textContent =
            data.title ||
            data.quiz_name ||
            "নামহীন কুইজ";


          quizSelect.appendChild(
            option
          );

        }
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ কুইজ লোড করতে সমস্যা হয়েছে।"
      );

    }

  }


  /*
   * QUIZ CHANGE
   */

  quizSelect.addEventListener(
    "change",
    loadQuestions
  );


  /*
   * LOAD QUESTIONS
   */

  async function loadQuestions() {

    const quizId =
      quizSelect.value;


    if (!quizId) {

      questionsList.innerHTML = `

        <div class="empty">
          আগে একটি কুইজ নির্বাচন করুন।
        </div>

      `;

      return;
    }


    questionsList.innerHTML = `

      <div class="loading">
        ⏳ প্রশ্ন লোড হচ্ছে...
      </div>

    `;


    try {

      const questionQuery =
        query(
          collection(db, "questions"),
          where(
            "quiz_id",
            "==",
            quizId
          )
        );


      const snapshot =
        await getDocs(
          questionQuery
        );


      if (snapshot.empty) {

        questionsList.innerHTML = `

          <div class="empty">
            এই কুইজে এখনো কোনো প্রশ্ন যোগ করা হয়নি।
          </div>

        `;

        return;
      }


      questionsList.innerHTML = "";


      snapshot.forEach(
        (docSnap) => {

          const data =
            docSnap.data();


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "question-item";


          item.innerHTML = `

            <div class="question-title">
              ${escapeHtml(
                data.question_text || ""
              )}
            </div>


            <div class="option-line">
              A. ${escapeHtml(
                data.option_a || ""
              )}
            </div>


            <div class="option-line">
              B. ${escapeHtml(
                data.option_b || ""
              )}
            </div>


            <div class="option-line">
              C. ${escapeHtml(
                data.option_c || ""
              )}
            </div>


            <div class="option-line">
              D. ${escapeHtml(
                data.option_d || ""
              )}
            </div>


            <div class="correct">
              🔒 সঠিক উত্তর:
              ${escapeHtml(
                data.correct_answer || ""
              )}
            </div>


            <div class="question-meta">

              নম্বর:
              ${data.marks ?? 1}

              &nbsp; | &nbsp;

              Negative:
              ${data.negative_mark ?? 0.25}

            </div>


            <div class="actions">

              <button
                class="edit">

                ✏️ Edit

              </button>


              <button
                class="delete">

                🗑️ Delete

              </button>

            </div>

          `;


          item
            .querySelector(".edit")
            .addEventListener(
              "click",
              () => {

                editQuestion(
                  docSnap.id,
                  data
                );

              }
            );


          item
            .querySelector(".delete")
            .addEventListener(
              "click",
              () => {

                deleteQuestion(
                  docSnap.id,
                  data
                );

              }
            );


          questionsList.appendChild(
            item
          );

        }
      );


    } catch (error) {

      console.error(error);

      questionsList.innerHTML = `

        <div class="empty">
          ❌ প্রশ্ন লোড করতে সমস্যা হয়েছে।
        </div>

      `;

    }

  }


  /*
   * SAVE QUESTION
   */

  saveBtn.addEventListener(
    "click",
    saveQuestion
  );


  async function saveQuestion() {

    const quizId =
      quizSelect.value;

    const text =
      questionText.value.trim();

    const a =
      optionA.value.trim();

    const b =
      optionB.value.trim();

    const c =
      optionC.value.trim();

    const d =
      optionD.value.trim();

    const answer =
      correctAnswer.value;

    const questionMarks =
      Number(
        marks.value || 1
      );

    const negative =
      Number(
        negativeMark.value || 0
      );


    /*
     * VALIDATION
     */

    if (!quizId) {

      showMessage(
        "⚠️ আগে কুইজ নির্বাচন করুন।"
      );

      return;
    }


    if (!text) {

      showMessage(
        "⚠️ প্রশ্ন লিখুন।"
      );

      return;
    }


    if (
      !a ||
      !b ||
      !c ||
      !d
    ) {

      showMessage(
        "⚠️ চারটি অপশনই পূরণ করুন।"
      );

      return;
    }


    if (!answer) {

      showMessage(
        "⚠️ সঠিক উত্তর নির্বাচন করুন।"
      );

      return;
    }


    saveBtn.disabled = true;


    showMessage(
      "⏳ প্রশ্ন সংরক্ষণ করা হচ্ছে..."
    );


    try {

      const adminUid =
        auth.currentUser.uid;


      /*
       * ADMIN QUESTION
       *
       * এখানে correct_answer থাকবে।
       */

      const adminQuestionData = {

        quiz_id:
          quizId,

        question_text:
          text,

        option_a:
          a,

        option_b:
          b,

        option_c:
          c,

        option_d:
          d,

        correct_answer:
          answer,

        marks:
          questionMarks,

        negative_mark:
          negative,

        updated_at:
          serverTimestamp(),

        updated_by:
          adminUid

      };


      /*
       * STUDENT QUESTION
       *
       * এখানে correct_answer থাকবে না।
       */

      const publicQuestionData = {

        quiz_id:
          quizId,

        question_text:
          text,

        option_a:
          a,

        option_b:
          b,

        option_c:
          c,

        option_d:
          d,

        marks:
          questionMarks,

        negative_mark:
          negative,

        updated_at:
          serverTimestamp()

      };


      /*
       * NEW QUESTION
       */

      if (!editingQuestionId) {


        const adminRef =
          await addDoc(
            collection(
              db,
              "questions"
            ),
            {
              ...adminQuestionData,

              created_at:
                serverTimestamp(),

              created_by:
                adminUid
            }
          );


        const publicRef =
          await addDoc(
            collection(
              db,
              "exam_questions"
            ),
            {
              ...publicQuestionData,

              admin_question_id:
                adminRef.id,

              created_at:
                serverTimestamp()
            }
          );


        /*
         * দুই collection-এর
         * সম্পর্ক রাখা হচ্ছে।
         */

        await updateDoc(
          doc(
            db,
            "questions",
            adminRef.id
          ),
          {
            exam_question_id:
              publicRef.id
          }
        );


        showMessage(
          "✅ প্রশ্ন সফলভাবে যোগ হয়েছে।"
        );


      } else {


        /*
         * UPDATE ADMIN QUESTION
         */

        await updateDoc(
          doc(
            db,
            "questions",
            editingQuestionId
          ),
          adminQuestionData
        );


        /*
         * UPDATE PUBLIC QUESTION
         */

        if (
          editingPublicQuestionId
        ) {

          await updateDoc(
            doc(
              db,
              "exam_questions",
              editingPublicQuestionId
            ),
            publicQuestionData
          );

        }


        showMessage(
          "✅ প্রশ্ন সফলভাবে আপডেট হয়েছে।"
        );

      }


      resetForm();

      await loadQuestions();


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ প্রশ্ন সংরক্ষণ করতে সমস্যা হয়েছে।"
      );

    } finally {

      saveBtn.disabled = false;

    }

  }


  /*
   * EDIT QUESTION
   */

  function editQuestion(
    id,
    data
  ) {

    editingQuestionId =
      id;


    editingPublicQuestionId =
      data.exam_question_id ||
      null;


    quizSelect.value =
      data.quiz_id || "";


    questionText.value =
      data.question_text || "";


    optionA.value =
      data.option_a || "";


    optionB.value =
      data.option_b || "";


    optionC.value =
      data.option_c || "";


    optionD.value =
      data.option_d || "";


    correctAnswer.value =
      data.correct_answer || "";


    marks.value =
      data.marks ?? 1;


    negativeMark.value =
      data.negative_mark ?? 0.25;


    saveBtn.textContent =
      "💾 প্রশ্ন আপডেট করুন";


    cancelBtn.classList.remove(
      "hidden"
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   * DELETE QUESTION
   */

  async function deleteQuestion(
    id,
    data
  ) {

    const confirmed =
      confirm(
        "এই প্রশ্নটি মুছে ফেলতে চান?"
      );


    if (!confirmed) {
      return;
    }


    try {

      /*
       * ADMIN QUESTION DELETE
       */

      await deleteDoc(
        doc(
          db,
          "questions",
          id
        )
      );


      /*
       * PUBLIC QUESTION DELETE
       */

      if (
        data.exam_question_id
      ) {

        await deleteDoc(
          doc(
            db,
            "exam_questions",
            data.exam_question_id
          )
        );

      }


      showMessage(
        "✅ প্রশ্ন মুছে ফেলা হয়েছে।"
      );


      await loadQuestions();


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ প্রশ্ন মুছতে সমস্যা হয়েছে।"
      );

    }

  }


  /*
   * CANCEL EDIT
   */

  cancelBtn.addEventListener(
    "click",
    resetForm
  );


  /*
   * RESET FORM
   */

  function resetForm() {

    editingQuestionId =
      null;


    editingPublicQuestionId =
      null;


    questionText.value =
      "";


    optionA.value =
      "";


    optionB.value =
      "";


    optionC.value =
      "";


    optionD.value =
      "";


    correctAnswer.value =
      "";


    marks.value =
      1;


    negativeMark.value =
      0.25;


    saveBtn.textContent =
      "➕ প্রশ্ন যোগ করুন";


    cancelBtn.classList.add(
      "hidden"
    );

  }


  /*
   * SECURITY:
   * HTML SPECIAL CHARACTER ESCAPE
   */

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>
