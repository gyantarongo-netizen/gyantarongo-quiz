<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নোটিশ | জ্ঞানতরঙ্গ</title><style>:root{--bg:#060817;--card:#10142b;--p:#8b3dff;--pk:#ec3fa7;--muted:#aeb5d6;--b:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#8b3dff22,transparent 35%),linear-gradient(135deg,var(--bg),#0a0d20);color:#fff;font-family:"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px}.top a{color:#fff;text-decoration:none;font-size:25px}.logo{width:44px}.brand b{display:block}.brand small{color:var(--muted)}.head,.notice{background:#10142bee;border:1px solid var(--b);border-radius:22px;padding:18px;margin-bottom:13px}.head h1{margin:0 0 5px}.head p,.meta{color:var(--muted);line-height:1.7}.notice h2{margin:0 0 7px;font-size:19px}.notice p{line-height:1.8;color:#dce0f5;margin:8px 0}.date{font-size:11px;color:#9ef0c9}.empty{text-align:center;color:var(--muted);padding:35px}.nav{position:fixed;left:0;right:0;bottom:0;height:66px;background:#080b1df5;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:center}.nav a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center}.nav a span{display:block;font-size:19px}.nav a.active{color:#ff63bc}</style></head><body><main class="wrap"><header class="top"><a href="index.html">←</a><img class="logo" src="gyantarongo-logo-transparent-1.png"><div class="brand"><b>নোটিশ</b><small>জ্ঞানতরঙ্গ</small></div></header><section class="head"><h1>📢 গুরুত্বপূর্ণ নোটিশ</h1><p>পরীক্ষা, রেজিস্ট্রেশন ও জ্ঞানতরঙ্গের গুরুত্বপূর্ণ ঘোষণা এখানে দেখুন।</p></section><section id="list"><div class="empty">⏳ নোটিশ লোড হচ্ছে...</div></section></main><nav class="nav"><a href="index.html"><span>🏠</span>হোম</a><a href="quiz.html"><span>📝</span>কুইজ</a><a href="library.html"><span>📚</span>লাইব্রেরি</a><a href="result.html"><span>🏆</span>ফলাফল</a><a href="profile.html"><span>👤</span>প্রোফাইল</a></nav><script type="module">import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const fmt=v=>{if(!v)return'';try{const d=v.toDate?v.toDate():new Date(v);return new Intl.DateTimeFormat('bn-BD',{dateStyle:'medium',timeStyle:'short'}).format(d)}catch{return''}};async function load(){try{const s=await getDocs(query(collection(db,'notices'),where('published','==',true)));const a=s.docs.map(d=>d.data()).sort((x,y)=>(y.created_at?.seconds||0)-(x.created_at?.seconds||0));document.querySelector('#list').innerHTML=a.length?a.map(n=>`<article class="notice"><h2>📌 ${esc(n.title||'নোটিশ')}</h2><div class="date">${fmt(n.created_at||n.published_at)}</div><p>${esc(n.message||n.description||n.content||'')}</p></article>`).join(''):'<div class="empty">বর্তমানে কোনো প্রকাশিত নোটিশ নেই।</div>'}catch(e){console.error(e);document.querySelector('#list').innerHTML='<div class="empty">নোটিশ লোড করা যায়নি।</div>'}}onAuthStateChanged(auth,u=>{if(!u){location.href='profile.html';return}load()});</script></body></html>
