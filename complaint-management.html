<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অভিযোগ ব্যবস্থাপনা | জ্ঞানতরঙ্গ</title><style>:root{--bg:#041312;--card:#0a201d;--g:#2fd68a;--muted:#a9c2bd;--b:#ffffff16;--red:#ff5470;--gold:#ffbd2e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#2fd68a20,transparent 32%),linear-gradient(135deg,#03100f,#061b18);color:#fff;font-family:"Noto Sans Bengali",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}.top a{color:#fff;text-decoration:none;font-size:24px}.logo{width:48px}.brand b{display:block;font-size:19px}.brand small{color:var(--muted)}.card{background:#0a201dee;border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:15px}.item{padding:15px;border:1px solid var(--b);border-radius:14px;margin:10px 0;background:#ffffff05}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted);font-size:11px}.status{padding:5px 8px;border-radius:99px;font-size:10px;background:#ffbd2e18;color:#ffd574}.approved{background:#2fd68a18;color:#75efb8}.rejected{background:#ff547018;color:#ff9aaa}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#2fd68a,#19a96c);color:#032018}.secondary{background:#ffffff0c;color:#fff;border:1px solid var(--b)}textarea,select{padding:9px;border:1px solid var(--b);border-radius:9px;background:#041312;color:#fff}textarea{width:100%;min-height:70px;margin-top:9px}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:800px){.wrap{padding:12px}}
</style></head><body><main class="wrap"><header class="top"><a href="admin-5.html">←</a><img class="logo" src="gyantarongo-logo-transparent-1.png"><div class="brand"><b>অভিযোগ ব্যবস্থাপনা</b><small>জ্ঞানতরঙ্গ Admin Panel</small></div></header><section class="card"><div class="row"><h2 style="margin:0;flex:1">💬 শিক্ষার্থীদের অভিযোগ</h2><button class="btn secondary" onclick="loadComplaints()">🔄 রিফ্রেশ</button></div><div id="list"><div class="empty">লোড হচ্ছে...</div></div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{collection,getDocs,getDoc,doc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';let user=null,items=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function guard(u){if(!u){location.href='admin-5.html';return false}const s=await getDoc(doc(db,'profiles',u.uid));if(!s.exists()||s.data().role!=='admin'||s.data().is_active!==true){location.href='admin-5.html';return false}user=u;return true}async function loadComplaints(){const s=await getDocs(collection(db,'complaints'));items=s.docs.map(d=>({id:d.id,...d.data()}));$('list').innerHTML=items.length?items.map(c=>{const st=c.status||'pending';return `<article class="item"><div class="row"><b>${esc(c.subject||'অভিযোগ')}</b><span class="status ${st}">${st==='approved'?'সমাধান হয়েছে':st==='rejected'?'বাতিল':'অপেক্ষমাণ'}</span></div><div class="muted">Student UID: ${esc(c.student_uid||'—')}</div><p style="line-height:1.7;color:#dcebe7">${esc(c.message||'')}</p><textarea id="reply-${c.id}" placeholder="Admin উত্তর লিখুন...">${esc(c.admin_reply||'')}</textarea><div class="row" style="margin-top:8px"><select id="status-${c.id}"><option value="pending" ${st==='pending'?'selected':''}>অপেক্ষমাণ</option><option value="approved" ${st==='approved'?'selected':''}>সমাধান হয়েছে</option><option value="rejected" ${st==='rejected'?'selected':''}>বাতিল</option></select><button class="btn primary" onclick="saveComplaint('${c.id}')">💾 Save</button></div></article>`}).join(''):'<div class="empty">কোনো অভিযোগ নেই।</div>'}window.loadComplaints=loadComplaints;window.saveComplaint=async id=>{await updateDoc(doc(db,'complaints',id),{status:$('status-'+id).value,admin_reply:$('reply-'+id).value.trim(),updated_at:serverTimestamp(),updated_by:user.uid});loadComplaints()};onAuthStateChanged(auth,async u=>{if(await guard(u))loadComplaints()});</script></body></html>
