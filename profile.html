<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  doc,
  getDoc,
  setDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type = "success") {

  const box = document.getElementById("message");

  if (!box) return;

  box.textContent = text;

  box.className =
    "message show " + type;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================
   LOGIN
========================================= */

async function loginStudent() {

  const button =
    document.getElementById("loginBtn");

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "⚠️ ইমেইল ও পাসওয়ার্ড দিন।",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ লগইন হচ্ছে...";


  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    currentUser =
      result.user;


    showMessage(
      "✅ সফলভাবে লগইন হয়েছে।",
      "success"
    );


    await loadProfile();


  } catch (error) {

    console.error(error);

    showMessage(
      "❌ লগইন করা যায়নি। ইমেইল বা পাসওয়ার্ড পরীক্ষা করুন।",
      "error"
    );


  } finally {

    button.disabled = false;

    button.textContent =
      "🔐 লগইন করুন";
  }
}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

  if (!currentUser) return;


  const authSection =
    document.getElementById("authSection");

  const profileSection =
    document.getElementById("profileSection");

  const loading =
    document.getElementById("loading");


  if (authSection)
    authSection.classList.add("hidden");

  if (loading)
    loading.classList.remove("hidden");


  try {

    const profileRef =
      doc(
        db,
        "profiles",
        currentUser.uid
      );


    const snapshot =
      await getDoc(profileRef);


    /*
      PROFILE না থাকলে
    */

    if (!snapshot.exists()) {

      if (profileSection)
        profileSection.classList.remove("hidden");


      document.getElementById("email").value =
        currentUser.email || "";


      showMessage(
        "⚠️ আপনার Profile এখনো তৈরি হয়নি। তথ্য পূরণ করে Save করুন।",
        "error"
      );

      return;
    }


    const data =
      snapshot.data();


    /*
      ACCOUNT STATUS
    */

    if (data.is_active === false) {

      showMessage(
        "❌ আপনার অ্যাকাউন্ট বর্তমানে নিষ্ক্রিয়।",
        "error"
      );

      await signOut(auth);

      return;
    }


    /*
      FORM DATA
    */

    document.getElementById("fullName").value =
      data.full_name || "";


    document.getElementById("mobile").value =
      data.mobile || "";


    document.getElementById("email").value =
      data.email ||
      currentUser.email ||
      "";


    document.getElementById("institution").value =
      data.institution || "";


    document.getElementById("className").value =
      data.class_name || "";


    document.getElementById("district").value =
      data.district || "";


    document.getElementById("division").value =
      data.division || "";


    document.getElementById("profileImageUrl").value =
      data.profile_image_url ||
      data.profile_photo_url ||
      "";


    /*
      PROFILE HEADER
    */

    document.getElementById("profileName").textContent =
      data.full_name ||
      "শিক্ষার্থী";


    document.getElementById("studentId").textContent =
      data.student_uid ||
      data.student_id ||
      "Student ID তৈরি হয়নি";


    /*
      AVATAR
    */

    updateAvatar(
      data.profile_image_url ||
      data.profile_photo_url ||
      "",
      data.full_name || "শিক্ষার্থী"
    );


    if (profileSection)
      profileSection.classList.remove("hidden");


  } catch (error) {

    console.error(error);

    showMessage(
      "❌ Profile তথ্য লোড করতে সমস্যা হয়েছে।",
      "error"
    );


  } finally {

    if (loading)
      loading.classList.add("hidden");
  }
}


/* =========================================
   SAVE / UPDATE PROFILE
========================================= */

async function saveProfile() {

  if (!currentUser) {

    showMessage(
      "🔐 আগে লগইন করুন।",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("saveBtn");


  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const mobile =
    document
      .getElementById("mobile")
      .value
      .trim();


  const institution =
    document
      .getElementById("institution")
      .value
      .trim();


  const className =
    document
      .getElementById("className")
      .value
      .trim();


  const district =
    document
      .getElementById("district")
      .value
      .trim();


  const division =
    document
      .getElementById("division")
      .value
      .trim();


  const profileImageUrl =
    document
      .getElementById("profileImageUrl")
      .value
      .trim();


  /*
    REQUIRED
  */

  if (!fullName) {

    showMessage(
      "⚠️ পূর্ণ নাম লিখুন।",
      "error"
    );

    return;
  }


  if (!mobile) {

    showMessage(
      "⚠️ মোবাইল নম্বর লিখুন।",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ তথ্য সংরক্ষণ হচ্ছে...";


  try {

    const profileRef =
      doc(
        db,
        "profiles",
        currentUser.uid
      );


    const snapshot =
      await getDoc(profileRef);


    /*
      EXISTING PROFILE DATA
    */

    let oldData = {};

    if (snapshot.exists()) {

      oldData =
        snapshot.data();
    }


    /*
      KEEP EXISTING STUDENT ID
    */

    let studentUid =
      oldData.student_uid ||
      oldData.student_id ||
      "";


    /*
      NEW STUDENT ID
      শুধুমাত্র Profile না থাকলে
    */

    if (!studentUid) {

      const number =
        String(Date.now()).slice(-6);

      studentUid =
        "GT-STU-" + number;
    }


    /*
      ROLE / ACTIVE STATUS
      আগের তথ্য থাকলে সেটাই থাকবে
    */

    const role =
      oldData.role ||
      "student";


    const isActive =
      oldData.is_active !== false;


    /*
      PROFILE DATA
    */

    const profileData = {

      id:
        currentUser.uid,

      student_uid:
        studentUid,

      full_name:
        fullName,

      mobile:
        mobile,

      email:
        currentUser.email ||
        oldData.email ||
        null,

      institution:
        institution ||
        null,

      class_name:
        className ||
        null,

      district:
        district ||
        null,

      division:
        division ||
        null,

      profile_image_url:
        profileImageUrl ||
        null,

      role:
        role,

      is_active:
        isActive,

      updated_at:
        serverTimestamp()
    };


    /*
      UPDATE / CREATE
    */

    if (snapshot.exists()) {

      await updateDoc(
        profileRef,
        profileData
      );

    } else {

      await setDoc(
        profileRef,
        {
          ...profileData,
          created_at:
            serverTimestamp()
        }
      );
    }


    /*
      UPDATE SCREEN
    */

    document.getElementById("profileName")
      .textContent =
      fullName;


    document.getElementById("studentId")
      .textContent =
      studentUid;


    updateAvatar(
      profileImageUrl,
      fullName
    );


    showMessage(
      "✅ আপনার Profile সফলভাবে আপডেট হয়েছে।",
      "success"
    );


  } catch (error) {

    console.error(
      "Profile Save Error:",
      error
    );


    showMessage(
      "❌ Profile সংরক্ষণ করা যায়নি। আবার চেষ্টা করুন।",
      "error"
    );


  } finally {

    button.disabled = false;

    button.textContent =
      "💾 তথ্য সংরক্ষণ করুন";
  }
}


/* =========================================
   AVATAR
========================================= */

function updateAvatar(
  imageUrl,
  name
) {

  const avatar =
    document.getElementById("avatar");


  if (!avatar) return;


  if (imageUrl) {

    avatar.innerHTML = "";


    const img =
      document.createElement("img");

    img.src =
      imageUrl;

    img.alt =
      "Profile";

    img.onerror = () => {

      avatar.textContent =
        getFirstLetter(name);
    };


    avatar.appendChild(img);

    return;
  }


  avatar.textContent =
    getFirstLetter(name);
}


/* =========================================
   FIRST LETTER
========================================= */

function getFirstLetter(name) {

  if (!name) return "👤";

  return name.trim().charAt(0) || "👤";
}


/* =========================================
   LOGOUT
========================================= */

async function logoutStudent() {

  try {

    await signOut(auth);

    currentUser = null;


    document
      .getElementById("profileSection")
      .classList.add("hidden");


    document
      .getElementById("authSection")
      .classList.remove("hidden");


    document
      .getElementById("loginEmail")
      .value = "";


    document
      .getElementById("loginPassword")
      .value = "";


    showMessage(
      "✅ সফলভাবে লগআউট হয়েছে।",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "❌ লগআউট করা যায়নি।",
      "error"
    );
  }
}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser =
        user;

      await loadProfile();

    } else {

      currentUser = null;


      document
        .getElementById("profileSection")
        .classList.add("hidden");


      document
        .getElementById("authSection")
        .classList.remove("hidden");
    }

  }
);


/* =========================================
   GLOBAL FUNCTIONS
========================================= */

window.loginStudent =
  loginStudent;

window.saveProfile =
  saveProfile;

window.logoutStudent =
  logoutStudent;

</script>
