<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অভিযোগ | জ্ঞানতরঙ্গ</title><style>:root{--bg:#060817;--card:#10142b;--p:#8b3dff;--pk:#ec3fa7;--g:#2fd68a;--muted:#aeb5d6;--b:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#8b3dff22,transparent 35%),linear-gradient(135deg,var(--bg),#0a0d20);color:#fff;font-family:"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 50px}.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px}.top a{color:#fff;text-decoration:none;font-size:25px}.logo{width:44px}.brand b{display:block}.brand small{color:var(--muted)}.card{background:#10142bee;border:1px solid var(--b);border-radius:22px;padding:18px;margin-bottom:14px}.card h1,.card h2{margin-top:0}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#dce0f5;font-size:12px}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--b);background:#080b1d;color:#fff;outline:none}textarea{min-height:120px;resize:vertical}.btn{width:100%;border:0;color:#fff;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--pk));font-weight:800}.item{padding:13px;border-radius:15px;background:#ffffff08;border:1px solid var(--b);margin-top:10px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#ffb21c18;color:#ffd574;font-size:10px}.status.approved{background:#2fd68a18;color:#75efb8}.status.rejected{background:#ff547018;color:#ff9aaa}.msg{margin:10px 0;padding:10px;border-radius:12px;background:#ffffff08;color:#dce0f5}.nav{position:fixed;left:0;right:0;bottom:0;height:66px;background:#080b1df5;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:center}.nav a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center}.nav a span{display:block;font-size:19px}</style></head><body><main class="wrap"><header class="top"><a href="index.html">←</a><img class="logo" src="gyantarongo-logo-transparent-1.png"><div class="brand"><b>অভিযোগ / সহায়তা</b><small>জ্ঞানতরঙ্গ</small></div></header><section class="card"><h1>💬 আপনার অভিযোগ বা সমস্যা</h1><p style="color:var(--muted);line-height:1.7">কুইজ, রেজিস্ট্রেশন, পেমেন্ট বা ফলাফল নিয়ে সমস্যা হলে লিখুন।</p><div id="msg"></div><div class="field"><label>বিষয়</label><input id="subject" placeholder="যেমন: পেমেন্ট যাচাই হয়নি"></div><div class="field"><label>বিস্তারিত</label><textarea id="message" placeholder="আপনার সমস্যাটি বিস্তারিত লিখুন..."></textarea></div><button id="send" class="btn">📨 অভিযোগ পাঠান</button></section><section class="card"><h2>📋 আমার অভিযোগ</h2><div id="list">লোড হচ্ছে...</div></section></main><nav class="nav"><a href="index.html"><span>🏠</span>হোম</a><a href="quiz.html"><span>📝</span>কুইজ</a><a href="library.html"><span>📚</span>লাইব্রেরি</a><a href="result.html"><span>🏆</span>ফলাফল</a><a href="profile.html"><span>👤</span>প্রোফাইল</a></nav><script type="module">import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{addDoc,collection,getDocs,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";let user=null;const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const label=s=>s==='approved'?'সমাধান হয়েছে':s==='rejected'?'বাতিল':'অপেক্ষমাণ';async function load(){try{const s=await getDocs(query(collection(db,'complaints'),where('student_uid','==',user.uid)));const a=s.docs.map(d=>d.data()).sort((x,y)=>(y.created_at?.seconds||0)-(x.created_at?.seconds||0));document.querySelector('#list').innerHTML=a.length?a.map(c=>`<div class="item"><b>${esc(c.subject||'অভিযোগ')}</b><p style="color:#c9cee5;line-height:1.7">${esc(c.message||'')}</p><span class="status ${c.status||''}">${label(c.status)}</span>${c.admin_reply?`<p style="color:#9ef0c9">Admin: ${esc(c.admin_reply)}</p>`:''}</div>`).join(''):'<div style="color:var(--muted);padding:20px 0">এখনো কোনো অভিযোগ নেই।</div>'}catch(e){console.error(e);document.querySelector('#list').textContent='অভিযোগ লোড করা যায়নি।'}}document.querySelector('#send').onclick=async()=>{const subject=document.querySelector('#subject').value.trim(),message=document.querySelector('#message').value.trim();if(!subject||!message){document.querySelector('#msg').innerHTML='<div class="msg">⚠️ বিষয় ও বিস্তারিত লিখুন।</div>';return}try{await addDoc(collection(db,'complaints'),{student_uid:user.uid,subject,message,status:'pending',created_at:serverTimestamp(),updated_at:serverTimestamp()});document.querySelector('#subject').value='';document.querySelector('#message').value='';document.querySelector('#msg').innerHTML='<div class="msg">✅ অভিযোগ পাঠানো হয়েছে।</div>';load()}catch(e){console.error(e);document.querySelector('#msg').innerHTML='<div class="msg">❌ অভিযোগ পাঠানো যায়নি।</div>'}};onAuthStateChanged(auth,u=>{if(!u){location.href='profile.html';return}user=u;load()});</script></body></html>
