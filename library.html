<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লাইব্রেরি | জ্ঞানতরঙ্গ</title><style>:root{--bg:#060817;--card:#10142b;--p:#8b3dff;--pk:#ec3fa7;--g:#2fd68a;--gold:#ffb21c;--muted:#aeb5d6;--b:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#8b3dff22,transparent 35%),linear-gradient(135deg,var(--bg),#0a0d20);color:#fff;font-family:"Noto Sans Bengali",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;gap:12px;padding:10px 0 18px}.top a{color:#fff;text-decoration:none;font-size:25px}.logo{width:44px;height:44px;object-fit:contain}.brand b{display:block}.brand small{color:var(--muted)}.hero,.card{background:#10142bee;border:1px solid var(--b);border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 18px 50px #0005}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:var(--muted);line-height:1.7}.search{width:100%;padding:13px;border-radius:13px;border:1px solid var(--b);background:#080b1d;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.book{padding:15px;border:1px solid #8b3dff33;border-radius:18px;background:linear-gradient(145deg,#151831,#0d1024)}.cover{height:130px;border-radius:14px;background:#ffffff09;display:grid;place-items:center;overflow:hidden;margin-bottom:12px}.cover img{width:100%;height:100%;object-fit:cover}.cover span{font-size:48px}.book h3{margin:5px 0;font-size:17px}.meta,.desc{color:var(--muted);font-size:12px;line-height:1.6}.btn{display:block;text-align:center;text-decoration:none;color:#fff;padding:11px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--pk));margin-top:11px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:35px}.nav{position:fixed;left:0;right:0;bottom:0;height:66px;background:#080b1df5;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:center}.nav a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center}.nav a span{display:block;font-size:19px}.nav a.active{color:#ff63bc}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}}
</style></head><body><main class="wrap"><header class="top"><a href="index.html">←</a><img class="logo" src="gyantarongo-logo-transparent-1.png"><div class="brand"><b>লাইব্রেরি</b><small>শিখি · জানি · এগিয়ে যাই</small></div></header><section class="hero"><h1>📚 জ্ঞানতরঙ্গ লাইব্রেরি</h1><p>কুইজের প্রস্তুতির জন্য বই, PDF ও শেখার উপকরণ পড়ুন।</p><input class="search" id="search" placeholder="বইয়ের নাম, লেখক বা বিভাগ খুঁজুন" style="margin-top:13px"></section><section id="grid" class="grid"><div class="empty">⏳ লাইব্রেরি লোড হচ্ছে...</div></section></main><nav class="nav"><a href="index.html"><span>🏠</span>হোম</a><a href="quiz.html"><span>📝</span>কুইজ</a><a class="active" href="library.html"><span>📚</span>লাইব্রেরি</a><a href="result.html"><span>🏆</span>ফলাফল</a><a href="profile.html"><span>👤</span>প্রোফাইল</a></nav><script type="module">import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";let books=[];const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");async function load(){try{const s=await getDocs(query(collection(db,"library_books"),where("published","==",true)));books=s.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);document.querySelector('#grid').innerHTML='<div class="empty">লাইব্রেরি লোড করা যায়নি।</div>'}}function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const a=books.filter(b=>!q||`${b.title} ${b.name} ${b.author} ${b.category}`.toLowerCase().includes(q));document.querySelector('#grid').innerHTML=a.length?a.map(b=>`<article class="book"><div class="cover">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="">`:'<span>📖</span>'}</div><h3>${esc(b.title||b.name||'বই')}</h3><div class="meta">${esc(b.author||'লেখক উল্লেখ নেই')} • ${esc(b.category||'সাধারণ')}</div><p class="desc">${esc(b.description||'')}</p>${b.pdf_url?`<a class="btn" href="${esc(b.pdf_url)}" target="_blank" rel="noopener">📖 পড়ুন / PDF</a>`:''}</article>`).join(''):'<div class="empty">কোনো বই পাওয়া যায়নি।</div>'}document.querySelector('#search').addEventListener('input',render);onAuthStateChanged(auth,u=>{if(!u){location.href='profile.html';return}load()});</script></body></html>
