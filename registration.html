<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>কুইজে রেজিস্ট্রেশন | জ্ঞানতরঙ্গ</title>
<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  collection,
  query,
  where,
  getDocs,
  addDoc,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentProfile = null;
let quizzes = [];
let selectedQuiz = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "info") {

  const box = document.getElementById("message");

  box.textContent = text;

  box.className = "message show " + type;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function showRegistrationMessage(text, type = "error") {

  const box =
    document.getElementById("registrationMessage");

  box.textContent = text;

  box.className =
    "message show " + type;

}


/* =========================
   AUTH TABS
========================= */

window.showAuthTab = function(tab) {

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");


  if (tab === "login") {

    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

  } else {

    loginForm.classList.add("hidden");
    signupForm.classList.remove("hidden");

    loginTab.classList.remove("active");
    signupTab.classList.add("active");

  }

};


/* =========================
   LOGIN
========================= */

window.loginStudent = async function() {

  const button =
    document.getElementById("loginBtn");

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "⚠️ ইমেইল ও পাসওয়ার্ড দিন।",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ লগইন হচ্ছে...";


  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    currentUser = result.user;

    await loadStudentData();


    showMessage(
      "✅ সফলভাবে লগইন হয়েছে।",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "❌ লগইন করা যায়নি। ইমেইল ও পাসওয়ার্ড পরীক্ষা করুন।",
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "🔐 লগইন করুন";

  }

};


/* =========================
   SIGNUP
========================= */

window.signupStudent = async function() {

  const button =
    document.getElementById("signupBtn");


  const fullName =
    document.getElementById("signupName")
      .value.trim();

  const mobile =
    document.getElementById("signupMobile")
      .value.trim();

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const institution =
    document.getElementById("signupInstitution")
      .value.trim();

  const studentClass =
    document.getElementById("signupClass")
      .value.trim();

  const district =
    document.getElementById("signupDistrict")
      .value.trim();

  const division =
    document.getElementById("signupDivision")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;

  const confirmPassword =
    document.getElementById("signupConfirm")
      .value;


  if (
    !fullName ||
    !mobile ||
    !email ||
    !password ||
    !confirmPassword
  ) {

    showMessage(
      "⚠️ তারকা (*) চিহ্নিত তথ্যগুলো পূরণ করুন।",
      "error"
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "⚠️ পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।",
      "error"
    );

    return;

  }


  if (password !== confirmPassword) {

    showMessage(
      "⚠️ দুইটি পাসওয়ার্ড মিলছে না।",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ অ্যাকাউন্ট তৈরি হচ্ছে...";


  try {

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      result.user;


    const studentId =
      "GT-STU-" +
      Date.now().toString().slice(-6);


    await setDoc(
      doc(db, "profiles", user.uid),
      {

        full_name: fullName,

        mobile: mobile,

        email: email,

        institution: institution,

        class: studentClass,

        district: district,

        division: division,

        student_id: studentId,

        role: "student",

        is_active: true,

        created_at: serverTimestamp(),

        updated_at: serverTimestamp()

      }
    );


    currentUser = user;


    await loadStudentData();


    showMessage(
      "🎉 আপনার অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে।",
      "success"
    );


  } catch (error) {

    console.error(error);


    let message =
      "❌ অ্যাকাউন্ট তৈরি করা যায়নি।";


    if (error.code === "auth/email-already-in-use") {

      message =
        "❌ এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে।";

    }

    if (error.code === "auth/invalid-email") {

      message =
        "❌ ইমেইল ঠিকানা সঠিক নয়।";

    }

    if (error.code === "auth/weak-password") {

      message =
        "❌ পাসওয়ার্ড আরও শক্তিশালী দিন।";

    }


    showMessage(
      message,
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "🚀 অ্যাকাউন্ট তৈরি করুন";

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser = user;

      await loadStudentData();

    } else {

      currentUser = null;

      currentProfile = null;

      document
        .getElementById("authSection")
        .classList.remove("hidden");

      document
        .getElementById("userSection")
        .classList.add("hidden");

    }

  }
);


/* =========================
   LOAD STUDENT DATA
========================= */

async function loadStudentData() {

  if (!currentUser) return;


  try {

    const profileRef =
      doc(
        db,
        "profiles",
        currentUser.uid
      );


    const profileSnap =
      await getDoc(profileRef);


    if (!profileSnap.exists()) {

      showMessage(
        "⚠️ আপনার Student Profile পাওয়া যায়নি।",
        "error"
      );

      return;

    }


    currentProfile =
      profileSnap.data();


    if (
      currentProfile.role !== "student"
    ) {

      showMessage(
        "❌ এই অ্যাকাউন্টটি শিক্ষার্থী অ্যাকাউন্ট নয়।",
        "error"
      );

      return;

    }


    if (
      currentProfile.is_active === false
    ) {

      showMessage(
        "❌ আপনার Student Account বর্তমানে নিষ্ক্রিয়।",
        "error"
      );

      return;

    }


    showUserSection();

    await loadQuizzes();

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ শিক্ষার্থীর তথ্য লোড করা যায়নি।",
      "error"
    );

  }

}


/* =========================
   SHOW USER
========================= */

function showUserSection() {

  document
    .getElementById("authSection")
    .classList.add("hidden");


  document
    .getElementById("userSection")
    .classList.remove("hidden");


  const userInfo =
    document.getElementById("userInfo");


  userInfo.innerHTML = `

    <strong>নাম:</strong>
    ${escapeHtml(currentProfile.full_name || "")}
    <br>

    <strong>Student ID:</strong>
    ${escapeHtml(currentProfile.student_id || "")}
    <br>

    <strong>মোবাইল:</strong>
    ${escapeHtml(currentProfile.mobile || "")}
    <br>

    <strong>ইমেইল:</strong>
    ${escapeHtml(currentProfile.email || "")}
    <br>

    <strong>প্রতিষ্ঠান:</strong>
    ${escapeHtml(currentProfile.institution || "দেওয়া হয়নি")}
    <br>

    <strong>শ্রেণি:</strong>
    ${escapeHtml(currentProfile.class || "দেওয়া হয়নি")}
    <br>

    <strong>জেলা:</strong>
    ${escapeHtml(currentProfile.district || "দেওয়া হয়নি")}
    <br>

    <strong>বিভাগ:</strong>
    ${escapeHtml(currentProfile.division || "দেওয়া হয়নি")}

  `;

}


/* =========================
   LOAD QUIZZES
========================= */

async function loadQuizzes() {

  const loading =
    document.getElementById("quizLoading");

  const grid =
    document.getElementById("quizGrid");

  const empty =
    document.getElementById("emptyQuiz");


  quizzes = [];


  loading.classList.remove("hidden");

  grid.classList.add("hidden");

  empty.classList.add("hidden");


  try {

    const quizzesRef =
      collection(db, "quizzes");


    const q =
      query(
        quizzesRef,
        where(
          "registration_open",
          "==",
          true
        )
      );


    const snapshot =
      await getDocs(q);


    snapshot.forEach(
      (item) => {

        quizzes.push({
          id: item.id,
          ...item.data()
        });

      }
    );


    loading.classList.add("hidden");


    if (quizzes.length === 0) {

      empty.classList.remove("hidden");

      return;

    }


    renderQuizzes();


  } catch (error) {

    console.error(error);

    loading.classList.add("hidden");

    empty.classList.remove("hidden");

    showMessage(
      "❌ কুইজ লোড করা যায়নি।",
      "error"
    );

  }

}


/* =========================
   RENDER QUIZZES
========================= */

function renderQuizzes() {

  const grid =
    document.getElementById("quizGrid");


  grid.innerHTML = "";


  quizzes.forEach(
    (quiz) => {

      const card =
        document.createElement("div");


      card.className =
        "quiz-card";


      const image =
        quiz.image_url
          ? `
            <img
              src="${escapeAttribute(quiz.image_url)}"
              alt="কুইজ">
          `
          : `
            <div class="quiz-image-placeholder">
              📚
            </div>
          `;


      const fee =
        Number(quiz.fee || 0);


      const feeText =
        fee > 0
          ? `৳ ${fee}`
          : "ফ্রি";


      const feeClass =
        fee > 0
          ? "fee-paid"
          : "fee-free";


      card.innerHTML = `

        <div class="quiz-image">

          ${image}

        </div>


        <div class="quiz-body">

          <div class="quiz-title">

            ${escapeHtml(
              quiz.title ||
              quiz.quiz_name ||
              "কুইজ"
            )}

          </div>


          <div class="category">

            ${escapeHtml(
              quiz.category ||
              "সাধারণ"
            )}

          </div>


          <div class="quiz-info">

            <div class="info-item">

              <div class="info-label">
                ফি
              </div>

              <div class="info-value ${feeClass}">
                ${feeText}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                প্রশ্ন
              </div>

              <div class="info-value">
                ${Number(
                  quiz.question_count || 0
                )}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                সময়
              </div>

              <div class="info-value">
                ${Number(
                  quiz.duration_minutes || 20
                )} মিনিট
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                অংশগ্রহণ
              </div>

              <div class="info-value">
                ${Number(
                  quiz.participants || 0
                )} জন
              </div>

            </div>

          </div>


          <div class="details">

            ${escapeHtml(
              quiz.description ||
              "এই কুইজে অংশ নিতে রেজিস্ট্রেশন করুন।"
            )}

          </div>


          <button
            class="primary-btn"
            onclick="openRegistration('${escapeAttribute(
              quiz.id
            )}')">

            📝 রেজিস্ট্রেশন করুন

          </button>

        </div>

      `;


      grid.appendChild(card);

    }
  );


  grid.classList.remove("hidden");

}


/* =========================
   OPEN REGISTRATION
========================= */

window.openRegistration =
async function(quizId) {

  selectedQuiz =
    quizzes.find(
      quiz => quiz.id === quizId
    );


  if (!selectedQuiz) {

    showMessage(
      "❌ কুইজ পাওয়া যায়নি।",
      "error"
    );

    return;

  }


  if (!currentUser || !currentProfile) {

    showMessage(
      "⚠️ আগে লগইন করুন।",
      "error"
    );

    return;

  }


  document
    .getElementById("registrationModal")
    .classList.add("show");


  document
    .getElementById("modalSubtitle")
    .textContent =
      selectedQuiz.title ||
      selectedQuiz.quiz_name ||
      "কুইজ";


  document
    .getElementById("regName")
    .value =
      currentProfile.full_name || "";


  document
    .getElementById("regMobile")
    .value =
      currentProfile.mobile || "";


  document
    .getElementById("regInstitution")
    .value =
      currentProfile.institution || "";


  const fee =
    Number(selectedQuiz.fee || 0);


  const paymentBox =
    document.getElementById("paymentBox");


  if (fee > 0) {

    paymentBox.classList.remove("hidden");

    await loadPaymentMethods();

  } else {

    paymentBox.classList.add("hidden");

  }

};


/* =========================
   PAYMENT METHODS
========================= */

async function loadPaymentMethods() {

  const select =
    document.getElementById("paymentMethod");


  select.innerHTML = `

    <option value="">
      নির্বাচন করুন
    </option>

  `;


  try {

    const ref =
      collection(
        db,
        "payment_methods"
      );


    const snapshot =
      await getDocs(ref);


    snapshot.forEach(
      (item) => {

        const data =
          item.data();


        if (data.is_active !== false) {

          const option =
            document.createElement("option");


          option.value =
            item.id;


          option.textContent =
            data.name ||
            data.method_name ||
            item.id;


          select.appendChild(option);

        }

      }
    );

  } catch (error) {

    console.error(error);

    showRegistrationMessage(
      "❌ পেমেন্ট পদ্ধতি লোড করা যায়নি।",
      "error"
    );

  }

}


/* =========================
   CONFIRM REGISTRATION
========================= */

window.confirmRegistration =
async function() {

  if (!currentUser || !currentProfile) {

    showRegistrationMessage(
      "⚠️ আগে লগইন করুন।",
      "error"
    );

    return;

  }


  if (!selectedQuiz) {

    showRegistrationMessage(
      "❌ কোনো কুইজ নির্বাচন করা হয়নি।",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("confirmBtn");


  const fee =
    Number(selectedQuiz.fee || 0);


  button.disabled = true;

  button.textContent =
    "⏳ রেজিস্ট্রেশন হচ্ছে...";


  try {

    /* =========================
       ALREADY REGISTERED CHECK
    ========================= */

    const registrationsRef =
      collection(
        db,
        "quiz_registrations"
      );


    const existingQuery =
      query(
        registrationsRef,
        where(
          "student_uid",
          "==",
          currentUser.uid
        )
      );


    const existingSnapshot =
      await getDocs(existingQuery);


    let alreadyRegistered = false;


    existingSnapshot.forEach(
      (item) => {

        const data =
          item.data();


        if (
          data.quiz_id ===
          selectedQuiz.id
        ) {

          alreadyRegistered = true;

        }

      }
    );


    if (alreadyRegistered) {

      showRegistrationMessage(
        "⚠️ আপনি এই কুইজে ইতিমধ্যে রেজিস্ট্রেশন করেছেন।",
        "error"
      );

      return;

    }


    /* =========================
       PAYMENT
    ========================= */

    let paymentData = null;


    if (fee > 0) {

      const paymentMethod =
        document
          .getElementById("paymentMethod")
          .value;

      const paymentNumber =
        document
          .getElementById("paymentNumber")
          .value
          .trim();

      const transactionId =
        document
          .getElementById("transactionId")
          .value
          .trim();

      const paymentScreenshot =
        document
          .getElementById("paymentScreenshot")
          .value
          .trim();


      if (
        !paymentMethod ||
        !paymentNumber ||
        !transactionId
      ) {

        showRegistrationMessage(
          "⚠️ পেমেন্টের সব প্রয়োজনীয় তথ্য দিন।",
          "error"
        );

        return;

      }


      paymentData = {

        method_id:
          paymentMethod,

        sender_number:
          paymentNumber,

        transaction_id:
          transactionId,

        screenshot_url:
          paymentScreenshot

      };

    }


    /* =========================
       CREATE ROLL NUMBER
    ========================= */

    const rollNumber =
      await generateQuizRoll(
        selectedQuiz.id
      );


    /* =========================
       SAVE REGISTRATION
    ========================= */

    await addDoc(
      registrationsRef,
      {

        student_uid:
          currentUser.uid,

        student_id:
          currentProfile.student_id || "",

        quiz_id:
          selectedQuiz.id,

        quiz_name:
          selectedQuiz.title ||
          selectedQuiz.quiz_name ||
          "কুইজ",

        roll_number:
          rollNumber,

        full_name:
          currentProfile.full_name || "",

        mobile:
          currentProfile.mobile || "",

        institution:
          currentProfile.institution || "",

        fee:
          fee,

        payment:
          paymentData,

        status:
          "pending",

        created_at:
          serverTimestamp()

      }
    );


    showRegistrationMessage(
      "🎉 রেজিস্ট্রেশন সফল হয়েছে। আপনার Quiz Roll Number: " +
      rollNumber +
      "। অনুমোদনের পর আপনি কুইজে অংশ নিতে পারবেন।",
      "success"
    );


    button.textContent =
      "✅ রেজিস্ট্রেশন সম্পন্ন";


  } catch (error) {

    console.error(error);

    showRegistrationMessage(
      "❌ রেজিস্ট্রেশন করা যায়নি। আবার চেষ্টা করুন।",
      "error"
    );

  } finally {

    button.disabled = false;

  }

};


/* =========================
   QUIZ ROLL NUMBER
========================= */

async function generateQuizRoll(quizId) {

  const registrationsRef =
    collection(
      db,
      "quiz_registrations"
    );


  const q =
    query(
      registrationsRef,
      where(
        "quiz_id",
        "==",
        quizId
      )
    );


  const snapshot =
    await getDocs(q);


  const number =
    snapshot.size + 1;


  return (
    "GT-26-" +
    String(number).padStart(4, "0")
  );

}


/* =========================
   CLOSE MODAL
========================= */

window.closeRegistrationModal =
function() {

  document
    .getElementById("registrationModal")
    .classList.remove("show");

  selectedQuiz = null;

};


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

}

</script>
