<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ক্যাটাগরি ব্যবস্থাপনা | জ্ঞানতরঙ্গ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#060817;
  --card:#10142b;
  --card2:#0c1024;
  --purple:#8b3dff;
  --purple2:#6d28d9;
  --pink:#ec3fa7;
  --green:#2fd68a;
  --gold:#ffb21c;
  --text:#f7f7ff;
  --muted:#8f96b3;
  --border:rgba(255,255,255,.08);
}

body{
  font-family:
    "Noto Sans Bengali",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  min-height:100vh;
  color:var(--text);

  background:
    radial-gradient(
      circle at 5% 0%,
      rgba(139,61,255,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 95% 10%,
      rgba(236,63,167,.14),
      transparent 27%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(47,214,138,.06),
      transparent 28%
    ),
    var(--bg);
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:rgba(6,8,23,.88);
  backdrop-filter:blur(20px);

  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

/* নতুন premium CSS logo */
.logo{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      rgba(139,61,255,.25),
      rgba(236,63,167,.18)
    );

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    0 0 25px rgba(139,61,255,.18);

  overflow:hidden;
}

.logo::before,
.logo::after{
  content:"";
  position:absolute;

  width:25px;
  height:17px;

  border:2px solid #b98aff;

  background:rgba(139,61,255,.10);
}

.logo::before{
  left:7px;
  top:15px;

  transform:
    skewY(-12deg)
    rotate(-2deg);

  border-radius:4px 2px 8px 4px;
}

.logo::after{
  right:7px;
  top:15px;

  transform:
    skewY(12deg)
    rotate(2deg);

  border-radius:2px 4px 4px 8px;
}

.logo-wave{
  position:absolute;

  bottom:8px;

  width:30px;
  height:7px;

  border-bottom:
    2px solid #ec3fa7;

  border-radius:50%;
}

.brand-title{
  font-size:17px;
  font-weight:900;
  letter-spacing:-.3px;
}

.brand-subtitle{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.back-btn{
  text-decoration:none;
  color:#fff;

  padding:10px 14px;

  border-radius:12px;

  background:#11152d;

  border:1px solid var(--border);

  font-size:12px;
  font-weight:800;

  transition:.2s;
}

.back-btn:hover{
  border-color:rgba(139,61,255,.55);
  transform:translateY(-1px);
}

/* =========================
   CONTAINER
========================= */

.container{
  width:min(1120px,100%);
  margin:auto;
  padding:28px 16px 55px;
}

.page-heading{
  margin-bottom:22px;
}

.page-heading h1{
  font-size:28px;
  font-weight:900;
}

.page-heading p{
  color:var(--muted);
  margin-top:7px;
  font-size:13px;
  line-height:1.6;
}

/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  padding:12px 15px;

  margin-bottom:17px;

  border-radius:13px;

  font-size:13px;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.success{
  color:#7ff0a5;
  background:rgba(47,214,138,.09);
  border:1px solid rgba(47,214,138,.22);
}

.message.error{
  color:#ff9b9b;
  background:rgba(239,68,68,.09);
  border:1px solid rgba(239,68,68,.22);
}

/* =========================
   FORM
========================= */

.form-card{
  padding:22px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(17,21,45,.96),
      rgba(12,16,36,.96)
    );

  border:1px solid var(--border);

  box-shadow:
    0 20px 60px rgba(0,0,0,.18);

  margin-bottom:25px;
}

.form-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  margin-bottom:7px;

  color:#d9dced;

  font-size:12px;
  font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;

  border:none;
  outline:none;

  color:#fff;
  background:#080c1e;

  border:1px solid rgba(255,255,255,.10);

  border-radius:13px;

  font-size:14px;

  padding:12px 13px;
}

.form-group input,
.form-group select{
  height:47px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.form-group select option{
  background:#10142b;
  color:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--purple);

  box-shadow:
    0 0 0 3px rgba(139,61,255,.12);
}

.form-hint{
  color:#707895;
  font-size:10px;
  margin-top:5px;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:17px;
}

.primary-btn,
.cancel-btn{
  min-height:46px;

  padding:0 18px;

  border-radius:13px;

  border:none;

  color:#fff;

  font-size:13px;
  font-weight:900;

  cursor:pointer;
}

.primary-btn{
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 10px 28px rgba(139,61,255,.20);
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.cancel-btn{
  display:none;
  background:#191d38;
  border:1px solid var(--border);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search-box{
  flex:1;
}

.search-box input,
.filter-box select{
  width:100%;
  height:45px;

  padding:0 13px;

  color:#fff;
  background:#0d1127;

  border:1px solid var(--border);

  border-radius:12px;

  outline:none;
}

.filter-box{
  width:210px;
}

.search-box input:focus,
.filter-box select:focus{
  border-color:var(--purple);
}

/* =========================
   LIST HEADER
========================= */

.list-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:14px;
}

.list-heading h2{
  font-size:19px;
  font-weight:900;
}

.total-badge{
  padding:6px 10px;

  border-radius:9px;

  background:rgba(139,61,255,.12);

  border:1px solid rgba(139,61,255,.22);

  color:#c9adff;

  font-size:11px;
  font-weight:900;
}

/* =========================
   GROUP
========================= */

.group-section{
  margin-bottom:20px;
}

.group-title{
  display:flex;
  align-items:center;
  gap:9px;

  margin-bottom:10px;

  font-size:15px;
  font-weight:900;
}

.group-line{
  flex:1;
  height:1px;
  background:rgba(255,255,255,.07);
}

/* =========================
   CATEGORY CARD
========================= */

.category-list{
  display:grid;
  gap:10px;
}

.category-card{
  display:flex;
  align-items:center;
  gap:14px;

  padding:14px;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #11152d,
      #0c1024
    );

  border:1px solid var(--border);

  transition:
    transform .2s,
    border-color .2s;
}

.category-card:hover{
  transform:translateY(-2px);
  border-color:rgba(139,61,255,.30);
}

.category-icon{
  width:50px;
  height:50px;

  flex:0 0 50px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  font-size:22px;

  background:
    linear-gradient(
      135deg,
      rgba(139,61,255,.14),
      rgba(236,63,167,.09)
    );

  border:1px solid rgba(139,61,255,.20);
}

.category-info{
  flex:1;
  min-width:0;
}

.category-name{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

.category-description{
  color:#858ca8;
  font-size:11px;
  line-height:1.5;
  margin-top:3px;
}

.category-meta{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.badge{
  display:inline-flex;

  padding:4px 7px;

  border-radius:7px;

  font-size:9px;
  font-weight:900;
}

.badge.active{
  color:#7ff0a5;
  background:rgba(47,214,138,.09);
}

.badge.inactive{
  color:#ff9b9b;
  background:rgba(239,68,68,.09);
}

.badge.group{
  color:#d0b7ff;
  background:rgba(139,61,255,.10);
}

.badge.order{
  color:#ffd67a;
  background:rgba(255,178,28,.08);
}

.category-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.action-btn{
  width:38px;
  height:38px;

  border-radius:10px;

  border:1px solid var(--border);

  background:#181c37;

  color:#fff;

  cursor:pointer;

  font-size:15px;
}

.action-btn:hover{
  border-color:rgba(139,61,255,.50);
}

.action-btn.delete:hover{
  border-color:rgba(239,68,68,.50);
}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading{
  text-align:center;

  padding:40px 20px;

  border-radius:18px;

  background:#10142b;

  border:1px solid var(--border);

  color:#858ca8;

  font-size:13px;
}

.empty-icon{
  font-size:35px;
  margin-bottom:9px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    height:64px;
    padding:0 11px;
  }

  .logo{
    width:40px;
    height:40px;
    border-radius:12px;
  }

  .brand-title{
    font-size:15px;
  }

  .brand-subtitle{
    display:none;
  }

  .back-btn{
    padding:8px 10px;
    font-size:10px;
  }

  .container{
    padding:20px 12px 40px;
  }

  .page-heading h1{
    font-size:23px;
  }

  .form-card{
    padding:17px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .form-actions{
    flex-direction:column;
  }

  .primary-btn,
  .cancel-btn{
    width:100%;
  }

  .toolbar{
    flex-direction:column;
  }

  .filter-box{
    width:100%;
  }

  .category-card{
    align-items:flex-start;
    padding:12px;
  }

  .category-icon{
    width:44px;
    height:44px;
    flex-basis:44px;
    font-size:19px;
  }

  .category-actions{
    flex-direction:column;
  }

  .action-btn{
    width:34px;
    height:34px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">

    <div class="logo">
      <div class="logo-wave"></div>
    </div>

    <div>
      <div class="brand-title">জ্ঞানতরঙ্গ</div>
      <div class="brand-subtitle">
        শিখি · জানি · এগিয়ে যাই
      </div>
    </div>

  </div>

  <a href="admin.html" class="back-btn">
    ← অ্যাডমিন প্যানেল
  </a>

</header>


<main class="container">

  <div class="page-heading">

    <h1>📚 ক্যাটাগরি ব্যবস্থাপনা</h1>

    <p>
      কুইজের ক্যাটাগরি তৈরি, সম্পাদনা ও নিয়ন্ত্রণ করুন।
    </p>

  </div>


  <div id="message" class="message"></div>


  <!-- FORM -->

  <section class="form-card">

    <div id="formTitle" class="form-title">
      ➕ নতুন ক্যাটাগরি যোগ করুন
    </div>


    <div class="form-grid">

      <div class="form-group">

        <label>ক্যাটাগরির নাম *</label>

        <input
          id="categoryName"
          type="text"
          maxlength="100"
          placeholder="যেমন: বাংলাদেশ বিষয়াবলি">

      </div>


      <div class="form-group">

        <label>আইকন</label>

        <input
          id="categoryIcon"
          type="text"
          maxlength="10"
          placeholder="🇧🇩">

      </div>


      <div class="form-group">

        <label>ক্যাটাগরি গ্রুপ *</label>

        <select id="groupName">

          <option value="🌙 ইসলামিক জ্ঞান">
            🌙 ইসলামিক জ্ঞান
          </option>

          <option value="🇧🇩 বাংলাদেশ">
            🇧🇩 বাংলাদেশ
          </option>

          <option value="🌍 বিশ্ব ও সাধারণ জ্ঞান">
            🌍 বিশ্ব ও সাধারণ জ্ঞান
          </option>

          <option value="🎓 একাডেমিক">
            🎓 একাডেমিক
          </option>

          <option value="🏆 বিশেষ প্রতিযোগিতা">
            🏆 বিশেষ প্রতিযোগিতা
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>ক্রম নম্বর</label>

        <input
          id="displayOrder"
          type="number"
          min="0"
          value="0"
          placeholder="0">

        <div class="form-hint">
          ছোট সংখ্যা আগে দেখাবে।
        </div>

      </div>


      <div class="form-group full">

        <label>সংক্ষিপ্ত বিবরণ</label>

        <textarea
          id="categoryDescription"
          maxlength="500"
          placeholder="এই ক্যাটাগরিতে কী ধরনের কুইজ থাকবে..."></textarea>

      </div>

    </div>


    <div class="form-actions">

      <button
        id="saveBtn"
        class="primary-btn"
        type="button">

        ➕ ক্যাটাগরি যোগ করুন

      </button>


      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button">

        বাতিল

      </button>

    </div>

  </section>


  <!-- SEARCH -->

  <div class="toolbar">

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="🔎 ক্যাটাগরি খুঁজুন...">

    </div>


    <div class="filter-box">

      <select id="statusFilter">

        <option value="all">
          সব ক্যাটাগরি
        </option>

        <option value="active">
          🟢 Active
        </option>

        <option value="inactive">
          🔴 Inactive
        </option>

      </select>

    </div>

  </div>


  <div class="list-heading">

    <h2>📋 ক্যাটাগরির তালিকা</h2>

    <span id="totalBadge" class="total-badge">
      0 টি
    </span>

  </div>


  <div id="categoryList">

    <div class="loading">
      ⏳ ক্যাটাগরি লোড হচ্ছে...
    </div>

  </div>

</main>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import { auth, db }
  from "./firebase-config.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy,
  serverTimestamp,
  where,
  limit
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================================
   VARIABLES
========================================= */

let currentAdmin = null;
let editingCategoryId = null;
let allCategories = [];


/* =========================================
   ELEMENTS
========================================= */

const messageBox =
  document.getElementById("message");

const categoryList =
  document.getElementById("categoryList");

const totalBadge =
  document.getElementById("totalBadge");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const formTitle =
  document.getElementById("formTitle");

const searchInput =
  document.getElementById("searchInput");

const statusFilter =
  document.getElementById("statusFilter");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type="success"){

  messageBox.textContent = text;

  messageBox.className =
    "message show " + type;

  setTimeout(()=>{
    messageBox.className="message";
  },4000);
}


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin(user){

  if(!user){
    window.location.href="admin.html";
    return false;
  }

  try{

    const profileRef =
      doc(db,"profiles",user.uid);

    const profileSnap =
      await getDoc(profileRef);

    if(!profileSnap.exists()){

      await signOut(auth);

      window.location.href="admin.html";

      return false;
    }

    const profile =
      profileSnap.data();

    if(
      String(profile.role || "").toLowerCase()
      !== "admin"
      ||
      profile.is_active === false
    ){

      await signOut(auth);

      window.location.href="admin.html";

      return false;
    }

    currentAdmin = {
      uid:user.uid,
      ...profile
    };

    return true;

  }catch(error){

    console.error(error);

    window.location.href="admin.html";

    return false;
  }
}


/* =========================================
   LOAD CATEGORIES
========================================= */

async function loadCategories(){

  categoryList.innerHTML = `
    <div class="loading">
      ⏳ ক্যাটাগরি লোড হচ্ছে...
    </div>
  `;

  try{

    const q = query(
      collection(db,"quiz_categories"),
      orderBy("group_order","asc"),
      orderBy("sort_order","asc")
    );

    const snap = await getDocs(q);

    allCategories =
      snap.docs.map(item => ({
        id:item.id,
        ...item.data()
      }));

    renderCategories();

  }catch(error){

    console.error(error);

    /*
      যদি নতুন compound index না থাকে,
      fallback হিসেবে সাধারণ collection query।
    */

    try{

      const snap =
        await getDocs(
          collection(db,"quiz_categories")
        );

      allCategories =
        snap.docs.map(item=>({
          id:item.id,
          ...item.data()
        }));

      allCategories.sort((a,b)=>{

        const ga =
          Number(a.group_order ?? 99);

        const gb =
          Number(b.group_order ?? 99);

        if(ga !== gb)
          return ga-gb;

        return Number(a.sort_order ?? 0)
          - Number(b.sort_order ?? 0);

      });

      renderCategories();

    }catch(secondError){

      console.error(secondError);

      categoryList.innerHTML=`
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          ক্যাটাগরি লোড করা যায়নি।
        </div>
      `;

      showMessage(
        "❌ ক্যাটাগরি লোড করতে সমস্যা হয়েছে।",
        "error"
      );
    }
  }
}


/* =========================================
   RENDER
========================================= */

function renderCategories(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const filter =
    statusFilter.value;


  let filtered =
    allCategories.filter(category=>{

      const name =
        String(category.name || "")
          .toLowerCase();

      const group =
        String(category.group_name || "")
          .toLowerCase();

      const matchesSearch =
        !search ||
        name.includes(search) ||
        group.includes(search);

      const active =
        category.is_active !== false;

      const matchesStatus =
        filter === "all"
        ||
        (filter === "active" && active)
        ||
        (filter === "inactive" && !active);

      return matchesSearch && matchesStatus;
    });


  totalBadge.textContent =
    `${filtered.length} টি`;


  if(!filtered.length){

    categoryList.innerHTML=`
      <div class="empty">

        <div class="empty-icon">
          📚
        </div>

        কোনো ক্যাটাগরি পাওয়া যায়নি।

      </div>
    `;

    return;
  }


  const groups = {};

  filtered.forEach(category=>{

    const group =
      category.group_name ||
      "অন্যান্য";

    if(!groups[group]){
      groups[group]=[];
    }

    groups[group].push(category);

  });


  const groupOrder = [
    "🌙 ইসলামিক জ্ঞান",
    "🇧🇩 বাংলাদেশ",
    "🌍 বিশ্ব ও সাধারণ জ্ঞান",
    "🎓 একাডেমিক",
    "🏆 বিশেষ প্রতিযোগিতা",
    "অন্যান্য"
  ];


  const sortedGroupNames =
    Object.keys(groups).sort((a,b)=>{

      const ia =
        groupOrder.indexOf(a);

      const ib =
        groupOrder.indexOf(b);

      return
        (ia===-1?999:ia)
        -
        (ib===-1?999:ib);
    });


  categoryList.innerHTML =
    sortedGroupNames.map(group=>{

      const items =
        groups[group];

      items.sort(
        (a,b)=>
          Number(a.sort_order ?? 0)
          -
          Number(b.sort_order ?? 0)
      );

      return `

        <section class="group-section">

          <div class="group-title">

            <span>
              ${escapeHtml(group)}
            </span>

            <div class="group-line"></div>

            <span
              style="
                color:#727995;
                font-size:10px;
              ">

              ${items.length}

            </span>

          </div>

          <div class="category-list">

            ${items
              .map(createCategoryCard)
              .join("")}

          </div>

        </section>

      `;

    }).join("");
}


/* =========================================
   CARD
========================================= */

function createCategoryCard(category){

  const active =
    category.is_active !== false;

  const icon =
    escapeHtml(
      category.icon || "📚"
    );

  const name =
    escapeHtml(
      category.name || ""
    );

  const description =
    escapeHtml(
      category.description || ""
    );

  const group =
    escapeHtml(
      category.group_name || "অন্যান্য"
    );

  const order =
    Number(
      category.sort_order ?? 0
    );


  return `

    <div class="category-card">

      <div class="category-icon">
        ${icon}
      </div>


      <div class="category-info">

        <div class="category-name">
          ${name}
        </div>

        <div class="category-description">
          ${
            description ||
            "কোনো বিবরণ দেওয়া হয়নি।"
          }
        </div>


        <div class="category-meta">

          <span class="badge group">
            ${group}
          </span>

          <span class="
            badge
            ${active ? "active" : "inactive"}
          ">
            ${
              active
              ? "● Active"
              : "● Inactive"
            }
          </span>

          <span class="badge order">
            ক্রম ${order}
          </span>

        </div>

      </div>


      <div class="category-actions">

        <button
          class="action-btn"
          title="সম্পাদনা"
          onclick="editCategory('${category.id}')">

          ✏️

        </button>


        <button
          class="action-btn"
          title="${
            active
            ? "Inactive করুন"
            : "Active করুন"
          }"
          onclick="
            toggleCategory(
              '${category.id}',
              ${active}
            )
          ">

          ${active ? "⏸️" : "▶️"}

        </button>


        <button
          class="action-btn delete"
          title="মুছে ফেলুন"
          onclick="
            deleteCategory(
              '${category.id}',
              '${escapeJs(category.name || "")}'
            )
          ">

          🗑️

        </button>

      </div>

    </div>

  `;
}

saveBtn.addEventListener(
  "click",
  async ()=>{

    const name =
      document
      .getElementById("categoryName")
      .value.trim();

    const icon =
      document
      .getElementById("categoryIcon")
      .value.trim();

    const groupName =
      document
      .getElementById("groupName")
      .value;

    const description =
      document
      .getElementById("categoryDescription")
      .value.trim();

    const displayOrder =
      Number(
        document
        .getElementById("displayOrder")
        .value
      ) || 0;


    if(!name){

      showMessage(
        "⚠️ ক্যাটাগরির নাম লিখুন।",
        "error"
      );

      return;
    }


    if(!groupName){

      showMessage(
        "⚠️ ক্যাটাগরি গ্রুপ নির্বাচন করুন।",
        "error"
      );

      return;
    }


    saveBtn.disabled=true;

    saveBtn.textContent =
      "⏳ সংরক্ষণ হচ্ছে...";


    try{

      const groupOrder =
        getGroupOrder(groupName);


      if(editingCategoryId){

        await updateDoc(
          doc(
            db,
            "quiz_categories",
            editingCategoryId
          ),
          {

            name:name,

            icon:
              icon || "📚",

            group_name:
              groupName,

            group_order:
              groupOrder,

            sort_order:
              displayOrder,

            description:
              description,

            updated_at:
              serverTimestamp(),

            updated_by:
              currentAdmin.uid

          }
        );


        showMessage(
          "✅ ক্যাটাগরি সফলভাবে আপডেট হয়েছে।"
        );

      }else{

        /*
          একই নাম + একই গ্রুপ আছে কি না যাচাই
        */

        const existing =
          allCategories.find(category=>
            String(category.name || "")
              .trim()
              .toLowerCase()
            ===
            name.toLowerCase()
            &&
            String(category.group_name || "")
            ===
            groupName
          );


        if(existing){

          showMessage(
            "⚠️ এই গ্রুপে একই নামে ক্যাটাগরি আগে থেকেই আছে।",
            "error"
          );

          return;
        }


        await addDoc(
          collection(db,"quiz_categories"),
          {

            name:name,

            icon:
              icon || "📚",

            group_name:
              groupName,

            group_order:
              groupOrder,

            sort_order:
              displayOrder,

            description:
              description,

            is_active:true,

            created_at:
              serverTimestamp(),

            updated_at:
              serverTimestamp(),

            created_by:
              currentAdmin.uid,

            updated_by:
              currentAdmin.uid

          }
        );


        showMessage(
          "✅ নতুন ক্যাটাগরি সফলভাবে যোগ হয়েছে।"
        );
      }


      resetForm();

      await loadCategories();

    }catch(error){

      console.error(error);

      showMessage(
        "❌ ক্যাটাগরি সংরক্ষণ করা যায়নি। Firestore Rules পরীক্ষা করুন।",
        "error"
      );

    }finally{

      saveBtn.disabled=false;

      saveBtn.textContent =
        editingCategoryId
        ? "💾 পরিবর্তন সংরক্ষণ করুন"
        : "➕ ক্যাটাগরি যোগ করুন";
    }

  }
);

/* =========================================
   DELETE
========================================= */

window.deleteCategory =
  async function(id,name){

    const confirmed =
      confirm(
        `“${name}” ক্যাটাগরিটি মুছে ফেলতে চান?\n\nক্যাটাগরিটির সঙ্গে কোনো কুইজ যুক্ত থাকলে মুছে ফেলা হবে না।`
      );

    if(!confirmed) return;


    try{

      /*
        প্রথমে quiz আছে কি না পরীক্ষা
      */

      const quizQuery =
        query(
          collection(db,"quizzes"),
          where("category_id","==",id),
          limit(1)
        );

      const quizSnap =
        await getDocs(quizQuery);


      if(!quizSnap.empty){

        showMessage(
          "⚠️ এই ক্যাটাগরির সঙ্গে কুইজ যুক্ত আছে। আগে কুইজের ক্যাটাগরি পরিবর্তন করুন।",
          "error"
        );

        return;
      }


      await deleteDoc(
        doc(
          db,
          "quiz_categories",
          id
        )
      );


      showMessage(
        "🗑️ ক্যাটাগরি মুছে ফেলা হয়েছে।"
      );


      await loadCategories();

    }catch(error){

      console.error(error);

      showMessage(
        "❌ ক্যাটাগরি মুছে ফেলা যায়নি।",
        "error"
      );
    }

  };

  };

  return orders[group] || 99;
}

/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeJs(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");
}

/* =========================================
   SEED INITIAL CATEGORIES
========================================= */

async function seedInitialCategories(){

  try{

    const snap =
      await getDocs(
        collection(db,"quiz_categories")
      );

    /*
      যদি আগে থেকেই category থাকে,
      তাহলে নতুন করে seed করবে না।
    */

    if(!snap.empty){
      return;
    }


    for(
      const category
      of INITIAL_CATEGORIES
    ){

      await addDoc(
        collection(db,"quiz_categories"),
        {

          ...category,

          is_active:true,

          created_at:
            serverTimestamp(),

          updated_at:
            serverTimestamp(),

          created_by:
            currentAdmin.uid,

          updated_by:
            currentAdmin.uid

        }
      );
    }


    showMessage(
      "🎉 প্রাথমিক ক্যাটাগরিগুলো সফলভাবে তৈরি হয়েছে।"
    );


  }catch(error){

    console.error(
      "Seed error:",
      error
    );

  }
}


/* =========================================
   START
========================================= */

onAuthStateChanged(
  auth,
  async user=>{

    if(!user){
      window.location.href="admin.html";
      return;
    }


    const allowed =
      await checkAdmin(user);


    if(!allowed) return;


    /*
      প্রথমবার হলে initial categories
      তৈরি হবে।
    */

    await seedInitialCategories();


    await loadCategories();

  }
);

</script>
