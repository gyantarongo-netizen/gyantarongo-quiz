}

body{

}

button{

}

.page{
  width:100%;

  margin:auto;

}

/* HEADER */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 0 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-box{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#11152D;
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.brand-title{
  font-size:19px;
  font-weight:800;
}

.brand-sub{

}

.bd-time{

  color:#B9C0D4;
  font-size:11px;
  line-height:1.5;
}

.bd-time strong{
  display:block;
  color:#fff;
  font-size:12px;
}

/* CARD */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(17,21,45,.96),
      rgba(10,13,31,.96)
    );
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  padding:20px;
  box-shadow:
    0 15px 45px rgba(0,0,0,.28);
  margin-bottom:16px;
}

/* EXAM INFO */

.exam-title{
  font-size:25px;
  font-weight:900;
  line-height:1.35;
  margin:0 0 8px;
}

.exam-category{
  color:#A78BFA;
  font-size:14px;
  margin-bottom:18px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-item{
  background:#0C1025;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  padding:12px;
}

.info-label{
  color:#8F96AA;
  font-size:11px;
  margin-bottom:5px;
}

.info-value{
  color:#fff;
  font-size:14px;
  font-weight:700;
}

/* STATUS */

  text-align:center;
  padding:28px 18px;
}

.status-icon{
  font-size:48px;
  margin-bottom:10px;
}

.status-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:8px;
}

.status-text{

  font-size:14px;
  line-height:1.7;
}

.countdown{

  font-weight:900;

  color:#C4B5FD;
}

.start-btn,
.next-btn,

.start-btn{

  transform:scale(.98);
}

.start-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* EXAM */

  display:none;
}

.exam-running.show{
  display:block;
}

.timer-box{
  position:sticky;
  top:10px;
  z-index:20;

.timer-label{

}

.timer{

  font-weight:900;

.progress-wrap{

  border-radius:10px;
  overflow:hidden;
}

.progress{

.question-card{

.question-number{

.question-text{

.option.selected{

.option.disabled{

  width:31px;
  height:31px;

  justify-content:center;

  background:#242A4A;
  margin-right:8px;
  font-weight:900;

/* AI NOTICE */

  font-size:10px;
  color:#777F96;
  padding:2px 8px 5px;
  line-height:1.3;
}

/* NEXT */

.next-area{

}

.next-btn{
  background:
    linear-gradient(
      135deg,
      #7C3AED,
      #8B3DFF

/* RESULT */

.finish-card{
  display:none;
  text-align:center;
}

.finish-card.show{
  display:block;
}

.finish-icon{

}

.finish-title{

.finish-text{

/* MESSAGE */

.message{

  padding:13px 15px;
  border-radius:14px;
  margin-bottom:15px;
  font-size:13px;
  line-height:1.6;

.message.error{

.message.success{

  }

  .timer{
    font-size:22px;
  }

}

/* =====================================================

   ===================================================== */

let registration = null;
let quiz = null;

let currentQuestionIndex = 0;

let selectedAnswers = {};

let globalEndTime = null;

const registrationId =

/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
  text,
  type="error"
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message show " + type;

}


/* =====================================================
   BANGLADESH TIME
   ===================================================== */

function updateBangladeshTime(){

  const now =
    new Date();

  const dateText =
    now.toLocaleDateString(
      "bn-BD",
      {
        timeZone:"Asia/Dhaka",
        year:"numeric",
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

  const timeText =
    now.toLocaleTimeString(
      "bn-BD",
      {
        timeZone:"Asia/Dhaka",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }
    );

  document.getElementById(
    "bdDateTime"
  ).textContent =
    dateText + " | " + timeText;

}

setInterval(
  updateBangladeshTime,
  1000
);

updateBangladeshTime();


/* =====================================================
   FORMAT DATE
   ===================================================== */

function formatBangladeshDate(
  value
){

  if(!value){
    return "--";
  }

  const date =
    new Date(value);

  return date.toLocaleString(
    "bn-BD",
    {
      timeZone:"Asia/Dhaka",
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}


/* =====================================================
   COUNTDOWN FORMAT
   ===================================================== */

function formatCountdown(
  milliseconds
){

  if(milliseconds <= 0){
    return "00:00:00";
  }

  const totalSeconds =
    Math.floor(
      milliseconds / 1000
    );

  const hours =
    Math.floor(
      totalSeconds / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  return [
    String(hours).padStart(2,"0"),
    String(minutes).padStart(2,"0"),
    String(seconds).padStart(2,"0")
  ].join(":");

}


/* =====================================================
   LOAD REGISTRATION
   ===================================================== */

async function loadRegistration(){

  if(!registrationId){

    showMessage(
      "🔐 আপনার পরীক্ষার Session পাওয়া যায়নি। আগে Roll Number যাচাই করুন।",
      "error"
    );

    document.getElementById(
      "statusIcon"
    ).textContent = "🔐";

    document.getElementById(
      "statusTitle"
    ).textContent =
      "Roll Number যাচাই করুন";

    document.getElementById(
      "statusText"
    ).textContent =
      "আগে পরীক্ষা প্রবেশ পেজ থেকে আপনার অনুমোদিত Roll Number যাচাই করুন।";

    document.getElementById(
      "countdown"
    ).textContent = "";

    return false;
  }

  try{

    const result =
      await supabaseClient
      .from("quiz_registrations")
      .select(`
        id,
        quiz_id,
        student_id,
        roll_number,
        student_name,
        mobile,
        email,
        institution,
        registration_status,
        payment_status,
        amount
      `)
      .eq(
        "id",
        registrationId
      )
      .maybeSingle();

    if(result.error){

      console.error(
        result.error
      );

      showMessage(
        "❌ Registration তথ্য লোড করা যায়নি।",
        "error"
      );

      return false;
    }

    if(!result.data){

      showMessage(
        "❌ আপনার Registration পাওয়া যায়নি।",
        "error"
      );

      return false;
    }

    registration =
      result.data;

    if(
      registration.registration_status &&
      registration.registration_status.toLowerCase() !== "approved"
    ){

      showMessage(
        "⏳ আপনার Registration এখনো Admin অনুমোদন করেননি।",
        "error"
      );

      return false;
    }

    if(
      registration.payment_status &&
      (
        registration.payment_status.toLowerCase() === "pending" ||
        registration.payment_status.toLowerCase() === "rejected"
      )
    ){

      showMessage(
        registration.payment_status.toLowerCase() === "pending"
        ? "💳 আপনার পেমেন্ট এখনো যাচাই করা হয়নি।"
        : "❌ আপনার পেমেন্ট প্রত্যাখ্যান করা হয়েছে।",
        "error"
      );

      return false;
    }

    return true;

  }catch(error){

    console.error(error);

    showMessage(
      "❌ Registration যাচাই করতে সমস্যা হয়েছে।",
      "error"
    );

    return false;
  }

}


/* =====================================================
   LOAD QUIZ
   ===================================================== */

async function loadQuiz(){

  const quizId =
    sessionQuizId ||
    registration.quiz_id;

  if(!quizId){

    showMessage(
      "❌ এই Registration-এর সঙ্গে কোনো Quiz যুক্ত নেই।",
      "error"
    );

    return false;
  }

  try{

    const result =
      await supabaseClient
      .from("quizzes")
      .select(`
        id,
        category_id,
        title,
        slug,
        description,
        duration_minutes,
        total_marks,
        negative_mark,
        passing_marks,
        fee,
        prize,
        status,
        start_at,
        end_at,
        total_questions,
        instructions
      `)
      .eq(
        "id",
        quizId
      )
      .maybeSingle();

    if(result.error){

      console.error(
        result.error
      );

      showMessage(
        "❌ Quiz তথ্য লোড করা যায়নি।",
        "error"
      );

      return false;
    }

    if(!result.data){

      showMessage(
        "❌ Quiz পাওয়া যায়নি।",
        "error"
      );

      return false;
    }

    quiz =
      result.data;

    return true;

  }catch(error){

    console.error(error);

    showMessage(
      "❌ Quiz লোড করতে সমস্যা হয়েছে।",
      "error"
    );

    return false;
  }

}

    !quiz.category_id

      "examCategory"
