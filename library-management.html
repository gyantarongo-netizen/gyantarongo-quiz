<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লাইব্রেরি ব্যবস্থাপনা | জ্ঞানতরঙ্গ</title><style>:root{--bg:#041312;--card:#0a201d;--g:#2fd68a;--gold:#ffbd2e;--red:#ff5470;--muted:#a9c2bd;--b:#ffffff16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#2fd68a20,transparent 32%),linear-gradient(135deg,#03100f,#061b18);color:#fff;font-family:"Noto Sans Bengali",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}.top a{color:#fff;text-decoration:none;font-size:24px}.logo{width:48px}.brand b{display:block;font-size:19px}.brand small{color:var(--muted)}.card{background:#0a201dee;border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:15px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#d8ebe6;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:10px;background:#041312;color:#fff}textarea{min-height:90px}.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#2fd68a,#19a96c);color:#032018}.secondary{background:#ffffff0c;color:#fff;border:1px solid var(--b)}.red{background:#ff547022;color:#ff9aaa;border:1px solid #ff547033}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid var(--b);font-size:11px;text-align:left}.empty{text-align:center;color:var(--muted);padding:30px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#2fd68a18;color:#75efb8;font-size:10px}.actions{display:flex;gap:6px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><header class="top"><a href="admin-5.html">←</a><img class="logo" src="gyantarongo-logo-transparent-1.png"><div class="brand"><b>লাইব্রেরি ব্যবস্থাপনা</b><small>জ্ঞানতরঙ্গ Admin Panel</small></div></header><div class="grid"><section class="card"><h2 id="formTitle">➕ নতুন বই</h2><input type="hidden" id="editId"><div class="field"><label>বইয়ের নাম *</label><input id="title"></div><div class="field"><label>লেখক</label><input id="author"></div><div class="field"><label>ক্যাটাগরি</label><input id="category" placeholder="যেমন: সাধারণ জ্ঞান"></div><div class="field"><label>বিবরণ</label><textarea id="description"></textarea></div><div class="field"><label>Cover Image URL</label><input id="cover_url" placeholder="https://..."></div><div class="field"><label>PDF / Book URL</label><input id="pdf_url" placeholder="https://..."></div><label class="check"><input id="published" type="checkbox"> শিক্ষার্থীদের দেখাবেন</label><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="save">💾 Save</button><button class="btn secondary" id="reset">পরিষ্কার</button></div><div id="msg" style="margin-top:10px;color:var(--muted)"></div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>📚 বইসমূহ</h2><button class="btn secondary" onclick="loadBooks()">🔄</button></div><div id="list" class="table"><div class="empty">লোড হচ্ছে...</div></div></section></div></main><script type="module">import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{collection,getDocs,getDoc,doc,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";let user=null,books=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function guard(u){if(!u){location.href='admin-5.html';return false}const s=await getDoc(doc(db,'profiles',u.uid));if(!s.exists()||s.data().role!=='admin'||s.data().is_active!==true){location.href='admin-5.html';return false}user=u;return true}async function loadBooks(){const s=await getDocs(collection(db,'library_books'));books=s.docs.map(d=>({id:d.id,...d.data()}));$('list').innerHTML=books.length?`<table><thead><tr><th>বই</th><th>লেখক</th><th>ক্যাটাগরি</th><th>Status</th><th>Action</th></tr></thead><tbody>${books.map(b=>`<tr><td>${esc(b.title||b.name||'—')}</td><td>${esc(b.author||'—')}</td><td>${esc(b.category||'—')}</td><td><span class="tag">${b.published?'প্রকাশিত':'গোপন'}</span></td><td class="actions"><button class="btn secondary" onclick="editBook('${b.id}')">Edit</button><button class="btn red" onclick="removeBook('${b.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">কোনো বই নেই।</div>'}window.loadBooks=loadBooks;window.editBook=id=>{const b=books.find(x=>x.id===id);if(!b)return;$('editId').value=id;$('formTitle').textContent='✏️ বই সম্পাদনা';$('title').value=b.title||b.name||'';$('author').value=b.author||'';$('category').value=b.category||'';$('description').value=b.description||'';$('cover_url').value=b.cover_url||'';$('pdf_url').value=b.pdf_url||'';$('published').checked=b.published===true;scrollTo({top:0,behavior:'smooth'})};window.removeBook=async id=>{if(!confirm('এই বইটি মুছে ফেলবেন?'))return;await deleteDoc(doc(db,'library_books',id));loadBooks()};$('save').onclick=async()=>{const title=$('title').value.trim();if(!title){$('msg').textContent='বইয়ের নাম দিন।';return}const data={title,author:$('author').value.trim(),category:$('category').value.trim(),description:$('description').value.trim(),cover_url:$('cover_url').value.trim(),pdf_url:$('pdf_url').value.trim(),published:$('published').checked,updated_at:serverTimestamp(),updated_by:user.uid};const id=$('editId').value;if(id)await updateDoc(doc(db,'library_books',id),data);else await addDoc(collection(db,'library_books'),{...data,created_at:serverTimestamp()});$('msg').textContent='✅ সংরক্ষণ হয়েছে।';$('reset').click();loadBooks()};$('reset').onclick=()=>{['editId','title','author','category','description','cover_url','pdf_url'].forEach(id=>$(id).value='');$('published').checked=false;$('formTitle').textContent='➕ নতুন বই';$('msg').textContent=''};onAuthStateChanged(auth,async u=>{if(await guard(u))loadBooks()});</script></body></html>
